/* ===== Khmer Student Information System ===== */
:root{
  --ink:#0f2438; --ink-2:#3c5468; --ink-3:#6b8497;
  --line:#e2ebf0; --line-2:#cfdde6;
  --bg:#f3f7f9; --card:#ffffff;
  --primary:#0d4a63; --primary-2:#12657f; --primary-3:#e6f2f6;
  --accent:#0f9d76; --accent-soft:#e6f7f1;
  --gold:#e0a12a; --gold-soft:#fdf4e3;
  --danger:#c8384a; --danger-soft:#fdecee;
  --blue:#2f6fed; --blue-soft:#eaf1ff;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,42,60,.05), 0 8px 24px -12px rgba(16,42,60,.18);
  --shadow-lg:0 24px 60px -20px rgba(9,35,52,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'KApp','Noto Sans Khmer','Khmer OS','Khmer OS System',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-2)}
::selection{background:#bfe6dc}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(170deg,#0a2b3d 0%,#0c3a51 55%,#0b4257 100%);
  color:#dcecf3;padding:22px 16px 16px;z-index:40;
}
.sidebar:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 180px at 90% 0%,rgba(15,157,118,.25),transparent 70%)}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 20px;position:relative;z-index:1}
.brand-badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#16b48a,#0b7d5f);box-shadow:0 8px 20px -8px rgba(15,157,118,.9)}
.brand-badge svg{width:24px;height:24px;stroke:#fff}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.5;color:#fff}
.brand span{font-size:11.5px;color:#8fb6c7;letter-spacing:.4px}
.nav-label{font-size:11px;letter-spacing:1.4px;color:#7ba4b7;padding:14px 12px 8px;font-weight:700;position:relative;z-index:1}
nav{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#c4dae5;
  padding:11px 12px;border-radius:11px;font-size:14px;font-weight:600;text-align:left;transition:.18s;position:relative}
.nav-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav-item.active:before{content:'';position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#2fd6a8}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);font-size:11.5px;padding:1px 8px;border-radius:20px;font-weight:700}
.side-foot{margin-top:auto;position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.side-school{background:rgba(255,255,255,.06);border-radius:12px;padding:12px;font-size:12px;line-height:1.7}
.side-school b{display:block;color:#fff;font-size:12.5px;margin-bottom:2px}
.side-school span{color:#9dc0cf;font-size:11.5px;display:block}
.side-ver{font-size:10.5px;color:#6f9aac;text-align:center;margin-top:12px;letter-spacing:.4px}

.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-title h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.1px}
.topbar-title p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.topbar-actions{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hamburger{display:none}
.content{padding:26px 30px 70px;max-width:1500px;width:100%;margin:0 auto}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;
  transition:.16s;white-space:nowrap;line-height:1.4}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.btn:hover{border-color:#b6cbd7;background:#f9fbfc;transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(135deg,#0f8f6c,#0d7a5c);border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -8px rgba(15,143,108,.9)}
.btn.primary:hover{background:linear-gradient(135deg,#12a37a,#0e8664)}
.btn.navy{background:var(--primary);border-color:transparent;color:#fff}
.btn.navy:hover{background:#0b3d52}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:#eef4f7}
.btn.danger{color:var(--danger);border-color:#f2ccd2;background:#fff}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.icon{padding:8px;width:34px;height:34px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Cards / KPIs ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:15px;font-weight:700}
.card-head .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.card-head .spacer{margin-left:auto}
.card-body{padding:18px 20px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{position:relative;overflow:hidden;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi:before{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--tint,#eef6f9)}
.kpi .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;background:var(--tint,#eef6f9);color:var(--tone,var(--primary-2))}
.kpi .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.kpi .label{font-size:12.5px;color:var(--ink-3);margin-top:14px;font-weight:600;letter-spacing:.2px}
.kpi .value{font-size:29px;font-weight:700;line-height:1.25;letter-spacing:-.5px;color:var(--ink)}
.kpi .value small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:5px;letter-spacing:0}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi .foot b{color:var(--accent);font-weight:700}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mb-18{margin-bottom:18px}

/* charts */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:88px 1fr 42px;align-items:center;gap:10px;font-size:12.5px}
.bar-row .name{color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:9px;border-radius:20px;background:#eef3f6;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#1aa07f,#0d7a5c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-row .num{text-align:right;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;align-items:center;gap:20px;justify-content:center;padding:6px 0 2px}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:none;
  background:conic-gradient(var(--seg1,#0f9d76) 0 var(--p1,50%),var(--seg2,#e0a12a) var(--p1,50%) 100%)}
.donut:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
.donut .mid b{font-size:21px;line-height:1.2;display:block}
.donut .mid span{font-size:11px;color:var(--ink-3)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-width:120px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Forms ---------- */
.form-section{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.fs-head{display:flex;gap:13px;align-items:flex-start;padding:16px 20px;background:linear-gradient(180deg,#fbfdfe,#f6fafb);border-bottom:1px solid var(--line)}
.fs-num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;
  background:var(--primary-3);color:var(--primary-2)}
.fs-head h3{margin:0;font-size:14.5px;font-weight:700}
.fs-head p{margin:1px 0 0;font-size:12px;color:var(--ink-3)}
.fs-head .fs-ico{margin-left:auto;color:#b9ccd7}
.fs-head .fs-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.fs-body{padding:20px}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px 16px}
.col-2{grid-column:span 2}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.req{color:var(--danger);font-weight:700}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:-2px}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:9px 12px;
  font-size:13.5px;line-height:1.6;transition:.15s;color:var(--ink);min-height:41px}
textarea{min-height:80px;resize:vertical;line-height:1.8}
input:hover,select:hover,textarea:hover{border-color:#b9cfdb}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,118,.13)}
input::placeholder,textarea::placeholder{color:#a7bac7}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b8497' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:32px}
input[readonly]{background:#f7fafb;color:var(--ink-2)}
.field.error input,.field.error select{border-color:var(--danger);background:#fffafb}
.field .err-msg{font-size:11.5px;color:var(--danger);display:none}
.field.error .err-msg{display:block}
.seg{display:inline-flex;background:#f1f6f8;border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-3);transition:.15s}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(16,42,60,.14)}
.seg button.on[data-v="ខ្មែរ"]{color:var(--ink)}
.pair{display:flex;gap:8px;align-items:center}
.pair .sep{color:#b9ccd7}
.bmi-out{display:flex;align-items:center;gap:8px;font-size:12px;min-height:26px;color:var(--ink-3);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.green{background:var(--accent-soft);color:#0a7a5b}
.pill.amber{background:var(--gold-soft);color:#9a6a10}
.pill.red{background:var(--danger-soft);color:#a5283a}
.pill.blue{background:var(--blue-soft);color:#2554b8}
.pill.gray{background:#f0f4f7;color:var(--ink-3)}
.form-actions{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  padding:12px 16px;box-shadow:0 -6px 24px -18px rgba(15,36,56,.5);margin-top:4px}
.form-actions .meta{font-size:12px;color:var(--ink-3)}
.form-actions .meta b{color:var(--ink-2)}
.progress{height:6px;border-radius:20px;background:#eaf1f4;width:150px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2fd6a8,#0f9d76);width:0;transition:width .3s}
.form-actions .right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#fcfdfe}
.search-box{position:relative;flex:1 1 240px;max-width:340px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#93aab8;fill:none;stroke-width:2}
.search-box input{padding-left:36px;background:#fff}
.filter-group{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.filter-group select{min-width:120px;width:auto;font-size:12.5px;padding-top:7px;padding-bottom:7px;min-height:36px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f7fafb;color:var(--ink-2);font-weight:700;font-size:12px;letter-spacing:.2px;text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:11px 14px;border-bottom:1px solid #eef4f7;vertical-align:middle}
tbody tr{transition:.12s}
tbody tr:hover{background:#f8fcfd}
tbody tr:last-child td{border-bottom:0}
tfoot th,tfoot td{padding:12px 14px;background:#eef5f8;color:var(--ink);font-weight:800;font-size:12.5px;
  border-top:2px solid #cfe0e8;white-space:nowrap;text-align:left}
tfoot th:first-child,tfoot td:first-child{border-radius:0 0 0 8px}
.t-name{display:flex;align-items:center;gap:10px}
.avatar{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;
  background:var(--primary-3);color:var(--primary-2);letter-spacing:0}
.avatar.f{background:#fdeef4;color:#b03a6d}
.t-name{min-width:0}
.t-name>div:last-child{min-width:0}
.t-name b{display:block;font-weight:600;font-size:13.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.t-name span{font-size:11px;color:var(--ink-3);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#rows td{white-space:nowrap}
#rows td.name-cell{max-width:300px}
.cell-sub{font-size:11.5px;color:var(--ink-3)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-actions .btn{width:30px;height:30px;padding:0;border-radius:8px;border-color:transparent;background:transparent;color:var(--ink-3)}
.row-actions .btn:hover{background:#eef4f7;color:var(--primary-2);border-color:transparent}
.row-actions .btn.del:hover{background:var(--danger-soft);color:var(--danger)}
.pager{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.pager .pages{margin-left:auto;display:flex;gap:4px}
.pager button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pager button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.4}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- Empty ---------- */
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty .art{width:78px;height:78px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:#f2f8fa;color:#a9c3d0}
.empty .art svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.5}
.empty h4{margin:0 0 4px;color:var(--ink);font-size:15px}
.empty p{margin:0 0 16px;font-size:12.5px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(9,28,42,.45);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:920px;box-shadow:var(--shadow-lg);
  animation:pop .22s cubic-bezier(.2,.8,.2,1);overflow:hidden;margin:auto 0}
@keyframes pop{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fbfdfe}
.modal-head h3{margin:0;font-size:15.5px}
.modal-head p{margin:0;font-size:12px;color:var(--ink-3)}
.modal-head .btn.icon{margin-left:auto}
.modal-body{padding:22px 24px 24px}
.modal-foot{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:#fbfdfe;flex-wrap:wrap}
.modal-foot .right{margin-left:auto;display:flex;gap:9px}
.confirm{max-width:430px}
.confirm .modal-body{text-align:center;padding:26px 24px 18px}
.confirm .warn-ico{width:52px;height:52px;border-radius:15px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 12px}
.confirm .warn-ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.confirm h4{margin:0 0 4px;font-size:15.5px}
.confirm p{margin:0;font-size:13px;color:var(--ink-2)}

/* profile sheet */
.sheet{background:#fff}
.sheet-head{text-align:center;padding-bottom:14px;border-bottom:2px double #cddde6;margin-bottom:18px}
.sheet-head .kh{font-family:'KApp','Noto Sans Khmer',serif;font-size:15px;font-weight:700;line-height:1.7}
.sheet-head .kh-sub{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.sheet-head .moeys{font-size:13px;font-weight:700;margin-top:6px}
.sheet-head .school{font-size:12.5px;color:var(--ink-2)}
.sheet-title{margin:14px 0 4px;font-size:16px;font-weight:700;letter-spacing:.3px}
.sheet-id{font-size:11.5px;color:var(--ink-3);letter-spacing:.6px}
.sheet-hero{display:flex;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfdfe;margin-bottom:18px}
.sheet-photo{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#d9ecf3,#eaf6f1);display:grid;place-items:center;font-size:23px;font-weight:700;color:var(--primary-2);flex:none}
.sheet-hero h4{margin:0;font-size:17px}
.sheet-hero .sub{font-size:12px;color:var(--ink-3)}
.sheet-hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--primary);margin:18px 0 9px;letter-spacing:.3px}
.sec-title:before{content:'';width:4px;height:15px;border-radius:3px;background:var(--accent)}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv{background:#fff;padding:9px 12px;min-width:0}
.kv .k{font-size:10.5px;color:var(--ink-3);line-height:1.6}
.kv .v{font-size:12.5px;font-weight:600;line-height:1.7;word-break:break-word}
.kv .v.muted{color:#a9bac6;font-weight:400}
.kv.span2{grid-column:span 2}
.kv.span3{grid-column:span 3}

/* ---------- Settings ---------- */
.set-list{display:flex;flex-direction:column;gap:2px}
.set-row{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid #eef4f7;flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .t b{display:block;font-size:13.5px;font-weight:600}
.set-row .t span{font-size:12px;color:var(--ink-3)}
.set-row .right{margin-left:auto;display:flex;gap:8px}
.notice{display:flex;gap:11px;padding:12px 14px;border-radius:11px;font-size:12.5px;line-height:1.8}
.notice.info{background:var(--blue-soft);color:#22478f}
.notice.warn{background:var(--gold-soft);color:#7d5510}
.notice.ok{background:var(--accent-soft);color:#0a6b50}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:22px;top:96px;z-index:300;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;background:#0f2e42;color:#fff;padding:11px 16px;border-radius:11px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.6);font-size:13px;max-width:380px;animation:slidein .25s ease}
.toast svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}
.toast.ok{background:#0b7a5d}.toast.err{background:#a5283a}.toast.warn{background:#8a6210}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff}
  .app,#toasts,.overlay{display:none!important}
  #printArea{display:block!important}
  .sheet{padding:0}
  .sheet-head{border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:10px}
  .sheet-head .kh{font-size:13px;line-height:1.55}
  .sheet-head .kh-sub,.sheet-head .school{font-size:11px;line-height:1.5}
  .sheet-head .moeys{font-size:11.5px}
  .sheet-title{margin:8px 0 2px;font-size:14px}
  .sheet-hero{padding:9px 11px;margin-bottom:10px;border-radius:8px}
  .sheet-photo{width:46px;height:46px;border-radius:9px;font-size:17px}
  .sheet-hero h4{font-size:14px}
  .kv-grid{border-color:#bbb;background:#bbb;border-radius:6px}
  .kv{border:0;padding:5px 8px}
  .kv .k{font-size:9px;line-height:1.45}
  .kv .v{font-size:11px;line-height:1.5}
  .sec-title{margin:10px 0 5px;font-size:11.5px}
  .sec-title:before{height:12px}
  .print-only>div{margin-top:14px!important}
  table{font-size:10.5px}
  thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}

/* ---------- Responsive ---------- */
@media(max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .kv-grid{grid-template-columns:repeat(2,1fr)}
  .kv.span3{grid-column:span 2}
}
@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:266px;transform:translateX(-100%);transition:.25s;box-shadow:20px 0 50px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .hamburger{display:inline-flex}
  .content{padding:18px 16px 70px}
  .topbar{padding:12px 16px}
  .scrim{position:fixed;inset:0;background:rgba(9,28,42,.4);z-index:35;display:none}
  .scrim.show{display:block}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .value{font-size:23px}
  .form-grid{gap:12px}
  .col-2,.col-3,.col-4,.col-6,.col-8{grid-column:span 12}
  .kv-grid{grid-template-columns:1fr}
  .kv.span2,.kv.span3{grid-column:span 1}
  .form-actions{gap:8px;padding:10px 12px}
  .form-actions .meta,.form-actions .progress{display:none}
  .form-actions .right{width:100%}
  .form-actions .right .btn{flex:1;min-height:42px}
  .topbar-title p{display:none}
  .toolbar{padding:12px}
  .filter-group{width:100%;margin-left:0}
  .filter-group select{flex:1}
}

/* ---------- Cloud (Firebase) ---------- */
.cloud-chip{display:flex;align-items:center;gap:7px;width:100%;margin:0 0 8px;padding:8px 10px;border-radius:9px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#eef7fb;font-size:11.5px;font-weight:600;font-family:inherit;
  cursor:pointer;text-align:left;transition:.15s;line-height:1.4}
.cloud-chip:hover{background:rgba(255,255,255,.12);color:#fff}
.cloud-chip .dot{width:7px;height:7px;border-radius:50%;background:#93aab8;flex:none;box-shadow:0 0 0 3px rgba(147,170,184,.18)}
.cloud-chip.ok .dot{background:#3ddcaa;box-shadow:0 0 0 3px rgba(61,220,170,.2)}
.cloud-chip.sync .dot{background:#4db8ff;animation:pulse 1.1s infinite}
.cloud-chip.err .dot{background:#ff8a9b;box-shadow:0 0 0 3px rgba(255,138,155,.2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cloud-state{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:20px;background:#f1f5f7;border:1px solid var(--line)}
.cloud-state .dot{width:8px;height:8px;border-radius:50%;background:#93aab8;flex:none}
.cloud-state b{display:block;font-size:12px;line-height:1.4;color:var(--ink)}
.cloud-state span{display:block;font-size:11px;color:var(--ink-3);line-height:1.45}
.cloud-state.ok{background:#e9f8f2;border-color:#bfe9da}
.cloud-state.ok .dot{background:#0f9d76}
.cloud-state.sync{background:#eaf4fd;border-color:#c5e2f8}
.cloud-state.sync .dot{background:#2f8fd0;animation:pulse 1.1s infinite}
.cloud-state.err{background:#fdeef0;border-color:#f5cdd4}
.cloud-state.err .dot{background:#c8384a}
.cloud-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
.cloud-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.cloud-actions .btn{min-height:38px}
.cloud-side{background:#f8fbfc;border:1px dashed #d7e5ec;border-radius:12px;padding:14px}
.cloud-note b{font-size:12.5px;color:var(--primary-2)}
.cloud-stats{display:flex;gap:10px;margin:9px 0 12px}
.cloud-stats div{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cloud-stats span{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.5}
.cloud-stats b{font-size:14px;color:var(--ink)}
.switch-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer}
.switch-row input{width:16px;height:16px;accent-color:#0f9d76;flex:none}
.cloud-hint{font-size:11.5px;color:var(--ink-3);line-height:1.75;margin:10px 0 0}
.cloud-help{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.cloud-help summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--primary-2);list-style:none;display:flex;align-items:center;gap:6px}
.cloud-help summary::-webkit-details-marker{display:none}
.cloud-help summary:before{content:'▸';color:var(--accent);font-size:13px}
.cloud-help[open] summary:before{content:'▾'}
.cloud-steps{margin:10px 0 12px;padding-left:20px;font-size:12.5px;line-height:2;color:var(--ink-2)}
.cloud-steps li{margin-bottom:2px}
.rules-box{background:#0f2e42;border-radius:10px;overflow:hidden}
.rules-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;color:#bcd7e6;font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.1)}
.rules-box pre{margin:0;padding:12px;color:#d7ecf6;font-size:11px;line-height:1.65;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
@media(max-width:1000px){.cloud-grid{grid-template-columns:1fr}}

/* component additions */
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.subhead{grid-column:span 12;font-size:12px;font-weight:700;color:var(--primary-2);padding:8px 0 0;border-top:1px dashed var(--line);margin-top:6px;display:flex;align-items:center;gap:7px}
.subhead:first-child{border-top:0;margin-top:0;padding-top:0}
.addr-block{background:#fafcfd;border:1px dashed #d5e3ea;border-radius:12px;padding:14px 14px 16px}
.addr-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--primary-2);margin-bottom:12px}
.addr-label .ic{width:15px;height:15px}
.copy-btn{margin-left:auto;color:var(--primary-2);font-size:11.5px}
.bmi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.print-only{display:none}
.modal .sheet{padding:0}
@media print{.print-only{display:block!important}}

/* ---------- population page ---------- */
#popTabs{flex-wrap:wrap}
#popTabs button{white-space:nowrap}
#popSample>div{min-width:0}
@media(max-width:1180px){
  #popTabs{order:3;width:100%;display:flex}
  #popTabs button{flex:1 1 auto;text-align:center;justify-content:center}
}
@media(max-width:760px){
  #popSample{flex-wrap:wrap}
  #popTabs button{padding:6px 8px;font-size:12px}
}
#popBody .pill{white-space:nowrap}
#popBody .row-actions{align-items:center}

/* ================= កាតថ្នាក់ · កាតសិស្ស · កាតគ្រួសារ ================= */
.cd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.cd-stat{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);min-width:0}
.cd-stat>div{min-width:0}
.cd-stat b{display:block;font-size:22px;line-height:1.3;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.cd-stat span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cd-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.cd-ico.blue{background:#e8f2f8;color:#0d5b7a}
.cd-ico.green{background:#e6f7f1;color:#0b7a5d}
.cd-ico.pink{background:#fdeef4;color:#b03a6d}
.cd-ico.gold{background:#fdf4e3;color:#9a6a10}

.cd-card{overflow:hidden}
.cd-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fcfdfe,#f8fbfc)}
.cd-tabs{display:flex;gap:5px;background:#eef4f7;border:1px solid var(--line);padding:4px;border-radius:12px;flex-wrap:wrap}
.cd-tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);
  padding:7px 13px;border-radius:9px;font-size:12.8px;font-weight:700;white-space:nowrap;transition:.16s;line-height:1.5}
.cd-tabs button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.cd-tabs button i{font-style:normal;font-size:11px;background:#fff;color:var(--ink-3);border-radius:20px;padding:0 7px;line-height:1.7;font-variant-numeric:tabular-nums}
.cd-tabs button:hover{color:var(--primary-2)}
.cd-tabs button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(16,42,60,.16)}
.cd-tabs button.on i{background:var(--primary-3);color:var(--primary-2)}
.cd-tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.cd-search{flex:0 1 250px;min-width:180px;max-width:270px}
.cd-search input{height:37px;min-height:37px}
.cd-sel{width:auto;min-width:126px;font-size:12.5px;min-height:37px;padding-top:6px;padding-bottom:6px}
.cd-toggle{display:inline-flex;background:#eef4f7;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.cd-toggle button{border:0;background:transparent;color:var(--ink-3);width:30px;height:29px;border-radius:8px;display:grid;place-items:center;transition:.15s}
.cd-toggle button svg{width:15px;height:15px}
.cd-toggle button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(16,42,60,.16)}
.cd-body{padding:18px}
.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px}

/* --- base card --- */
.kcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,42,60,.04);transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.kcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(16,42,60,.5);border-color:#cbdfe8}
.kcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* avatars */
.kav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700;
  background:linear-gradient(140deg,#dceef8,#c9e4f2);color:#14608a;letter-spacing:0}
.kav.f{background:linear-gradient(140deg,#fde7f0,#f8d3e2);color:#a83266}
.kav.gold{background:linear-gradient(140deg,#fdf1d6,#f7e2b4);color:#8a5c0c}
.kav.sm{width:26px;height:26px;border-radius:8px;font-size:11px;border:2px solid #fff;margin-left:-7px;box-shadow:0 1px 3px rgba(16,42,60,.12)}
.kav.sm:first-child{margin-left:0}
.kav.lg{width:46px;height:46px;border-radius:13px;font-size:18px}
.kav.xl{width:64px;height:64px;border-radius:18px;font-size:25px}
.pill.pink{background:#fdeef4;color:#a83266}
.pill.gold{background:#fdf1d6;color:#8a5c0c}
.avatar.gold{background:#fdf1d6;color:#8a5c0c}

/* --- class card --- */
.kclass-h{padding:15px 16px 14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c1,#0d4a63),var(--c2,#08303f))}
.kclass-h:after{content:'';position:absolute;right:-26px;top:-34px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.12)}
.kclass-h:before{content:'';position:absolute;right:26px;bottom:-38px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08)}
.kclass-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;background:rgba(255,255,255,.22);
  padding:1px 9px;border-radius:20px;line-height:1.7;position:relative;z-index:1}
.kclass-n{font-size:20px;font-weight:700;line-height:1.55;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;letter-spacing:.2px}
.kclass-s{font-size:11.5px;color:rgba(255,255,255,.85);line-height:1.7;white-space:nowrap;position:relative;z-index:1}
.kclass-b{padding:13px 16px 12px}
.ksplit{height:6px;border-radius:20px;background:#dfeef5;overflow:hidden;margin-bottom:11px}
.ksplit i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#ef7fae,#d95d95)}
.kclass-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:11px}
.kclass-kv>div{min-width:0}
.kclass-kv span{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;line-height:1.6}
.kclass-kv b{display:block;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.kclass-mini{display:flex;align-items:center;padding-left:7px}
.kmore{width:26px;height:26px;border-radius:8px;background:#eef4f7;color:var(--ink-2);display:grid;place-items:center;
  font-size:10.5px;font-weight:700;margin-left:-7px;border:2px solid #fff;flex:none}

/* --- student card --- */
.kstud-h{display:flex;align-items:center;gap:11px;padding:14px 15px 11px;min-width:0}
.kstud-nm{flex:1;min-width:0}
.kstud-nm b{display:block;font-size:14px;font-weight:700;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.kstud-nm span{display:block;font-size:10.8px;color:var(--ink-3);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.kstud-h .pill{flex:none}
.kstud-meta{display:grid;grid-template-columns:1.25fr .8fr 1.1fr;gap:6px;padding:0 15px 12px}
.kstud-meta>div{min-width:0;background:#f8fbfc;border:1px solid #edf3f6;border-radius:9px;padding:6px 9px}
.kstud-meta span{display:block;font-size:10px;color:var(--ink-3);line-height:1.6}
.kstud-meta b{display:block;font-size:12px;font-weight:700;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- family card --- */
.kfam-h{display:flex;align-items:center;gap:8px;padding:12px 15px;background:linear-gradient(180deg,#fbf8ef,#f8f4e8);border-bottom:1px solid #f0e8d4}
.kfam-id{font-size:12.5px;font-weight:700;color:#7d5510;letter-spacing:.2px;white-space:nowrap}
.kfam-v{font-size:11px;color:#9a8452;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.kfam-head{display:flex;align-items:center;gap:10px;padding:12px 15px 10px;position:relative;min-width:0}
.kfam-crown{position:absolute;right:13px;top:10px;font-size:10px;font-weight:700;background:#fdf1d6;color:#8a5c0c;
  border:1px solid #f2dfae;border-radius:20px;padding:0 8px;line-height:1.8;white-space:nowrap}
.kfam-hn{min-width:0;min-width:0;padding-right:74px}
.kfam-hn b{display:block;font-size:14px;font-weight:700;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfam-hn span{display:block;font-size:11px;color:var(--ink-3);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfam-chips{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;padding:0 15px 11px;min-height:26px;align-items:center}
.kchip{display:inline-block;font-size:10.8px;background:#f3f7f9;border:1px solid #e6eff3;color:var(--ink-2);
  border-radius:20px;padding:0 9px;line-height:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;flex:none}
.kchip.more{background:#eef4f7;color:var(--ink-3)}

/* --- shared footer --- */
.kfoot{display:flex;align-items:center;gap:7px;padding:8px 15px;border-top:1px solid #eef4f7;background:#fcfdfe;
  font-size:11px;color:var(--ink-3);margin-top:auto;flex-wrap:nowrap;overflow:hidden;min-height:38px}
.kfoot .muted{color:#a9bac6}
.kfoot .cd-open{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--primary-2);font-weight:700;white-space:nowrap;flex:none}
.kfoot .cd-open svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.kdot{width:3px;height:3px;border-radius:50%;background:#c3d3dc;flex:none}
.kclass .kfoot,.kstud .kfoot,.kfam .kfoot{margin-top:0}
.kstud{display:flex;flex-direction:column}
.kfam{display:flex;flex-direction:column}

/* --- tables --- */
.cd-table thead th{background:#f6fafb}
.cd-table td{white-space:nowrap}
.cd-table .t-name b{max-width:320px}
.cd-sortable{cursor:pointer;user-select:none;transition:color .15s}
.cd-sortable:hover{color:var(--primary-2);background:#eef6f9}
.cd-sortable .sarr{display:inline-block;margin-left:5px;font-size:9px;color:#b6c9d5;vertical-align:1px}
.cd-sortable.on{color:var(--primary-2)}
.cd-sortable.on .sarr{color:var(--accent)}
.cd-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
.cd-nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.cd-clickrow{cursor:pointer}
.cd-pagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 4px 2px;font-size:12px;color:var(--ink-3)}
.cd-pagebar b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cd-pagebar .pages{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.cd-pagebar .pages button{min-width:31px;height:31px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.cd-pagebar .pages button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.cd-pagebar .pages button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.cd-pagebar .pages button:disabled{opacity:.4;cursor:not-allowed}

/* --- card detail modal --- */
.cd-modal{max-height:none}
.cd-modal .modal-body{padding:0}
.cdm-head{padding:16px 22px 17px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c1,#0d4a63),var(--c2,#08303f))}
.cdm-head:after{content:'';position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.cdm-head.plain{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:14px}
.cdm-head.gold-h{background:linear-gradient(135deg,#b5811a,#8a5c0c)}
.cdm-headtop{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.cdm-kicker{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:1px 10px;line-height:1.9}
.cdm-head.plain .cdm-kicker{background:var(--primary-3);color:var(--primary-2);border-color:#d3e7ee}
.cdm-headtop .btn.icon{margin-left:auto;color:inherit;background:rgba(255,255,255,.14);border:0;width:30px;height:30px}
.cdm-head.plain .cdm-headtop .btn.icon{background:#f2f7f9;color:var(--ink-2)}
.cdm-head h3{margin:8px 0 0;font-size:21px;font-weight:700;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.cdm-head p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.86);line-height:1.7;position:relative;z-index:1}
.cdm-body{padding:18px 22px 20px}
.cdm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.cdm-stats>div{background:#f7fbfc;border:1px solid #e8f1f5;border-radius:11px;padding:9px 12px;min-width:0}
.cdm-stats b{display:block;font-size:18px;line-height:1.35;font-variant-numeric:tabular-nums}
.cdm-stats span{display:block;font-size:10.8px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdm-villages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cdm-section-t{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:16px 0 9px;font-size:13px;font-weight:700;color:var(--primary)}
.cdm-section-t span{font-size:11px;font-weight:400;color:var(--ink-3)}

/* student hero inside modal */
.cds-hero{display:flex;align-items:center;gap:15px;margin-top:12px;min-width:0}
.cds-hero-t{min-width:0}
.cds-hero-t h3{margin:0;font-size:20px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cds-hero-t p{margin:1px 0 0;font-size:11.8px;color:var(--ink-3);line-height:1.7}
.cds-hero-t .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cd-sec{margin-bottom:4px}
.cd-sec .sec-title{margin-top:16px}
.cd-famlink{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f8fbfc;border:1px dashed #d7e5ec;border-radius:11px;padding:11px 13px}
.cd-famlink-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.8px;color:var(--ink-2);min-width:0}
.cd-famlink-l b{color:var(--ink)}
.cd-famlink .btn{margin-left:auto}
.cd-emptyline{font-size:12px;color:var(--ink-3);background:#f8fbfc;border:1px dashed #dbe8ee;border-radius:11px;padding:11px 13px;line-height:1.8}

/* family head card */
.cd-headcard{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#fdf8ea,#fbf3df);border:1px solid #f0e2bd;
  border-radius:14px;padding:14px 16px;min-width:0}
.cd-headcard-t{min-width:0;flex:1}
.cd-headcard-k{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;background:#fff;color:#8a5c0c;
  border:1px solid #f0dca8;border-radius:20px;padding:0 9px;line-height:1.9}
.cd-headcard-t h4{margin:4px 0 0;font-size:17px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-headcard-t p{margin:0;font-size:11.5px;color:#8a7442;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-headcard-s{flex:none;text-align:center;background:#fff;border:1px solid #f0e2bd;border-radius:11px;padding:6px 14px}
.cd-headcard-s b{display:block;font-size:19px;line-height:1.3;color:#8a5c0c;font-variant-numeric:tabular-nums}
.cd-headcard-s span{display:block;font-size:10.5px;color:#9a8452;white-space:nowrap}
.cd-empty{padding:40px 16px}

@media(max-width:1180px){
  .cd-stats{grid-template-columns:repeat(2,1fr)}
  .cd-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media(max-width:900px){
  .cd-bar{align-items:stretch}
  .cd-tools{margin-left:0;width:100%}
  .cd-search{flex:1 1 200px;max-width:none}
  .cdm-stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .cd-stats{grid-template-columns:1fr 1fr;gap:9px}
  .cd-stat{padding:10px 12px;gap:9px}
  .cd-stat b{font-size:18px}
  .cd-ico{width:34px;height:34px;border-radius:10px}
  .cd-body{padding:12px}
  .cd-grid{grid-template-columns:1fr;gap:12px}
  .cd-tabs{width:100%}
  .cd-tabs button{flex:1 1 auto;justify-content:center;padding:7px 8px;font-size:11.5px}
  .cd-tabs button i{display:none}
  .cd-tools{gap:6px}
  .cd-sel{flex:1 1 45%;min-width:0}
  .cdm-head{padding:14px 15px}
  .cdm-head h3{font-size:18px}
  .cdm-body{padding:14px 15px 16px}
  .cds-hero{gap:11px}
  .kav.xl{width:52px;height:52px;border-radius:15px;font-size:20px}
  .cds-hero-t h3{font-size:16.5px}
  .cd-headcard{gap:10px;padding:12px}
  .cd-headcard-t h4{font-size:15px}
  .cd-headcard-s{display:none}
  .cd-famlink .btn{margin-left:0}
}
.kstud{border-top:3px solid var(--c1,#0d4a63)}
.kstud .kstud-h{padding-top:12px}

/* ---------- Dashboard: students vs population ---------- */
.dash-cmp{overflow:hidden}
.cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cmp-tile{position:relative;border:1px solid var(--line);border-radius:14px;padding:13px 15px 11px 17px;
  background:linear-gradient(180deg,#fff,#fbfdfe);cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;min-width:0;overflow:hidden}
.cmp-tile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,#0d4a63);opacity:.9}
.cmp-tile:hover{transform:translateY(-2px);border-color:#c9dfe9;box-shadow:0 12px 26px -18px rgba(16,42,60,.5)}
.cmp-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmp-h{display:flex;align-items:center;gap:8px;min-width:0}
.cmp-ico{width:29px;height:29px;border-radius:9px;background:var(--tint,#eef4f7);color:var(--tone,#0d4a63);display:grid;place-items:center;flex:none}
.cmp-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.cmp-t{font-size:13px;font-weight:700;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cmp-age{margin-left:auto;font-size:9.8px;font-weight:700;color:var(--tone,#0d4a63);background:var(--tint,#eef4f7);
  border-radius:20px;padding:0 8px;line-height:2;white-space:nowrap;flex:none}
.cmp-nums{display:flex;align-items:flex-end;gap:7px;margin-top:9px}
.cmp-n b{display:block;font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.cmp-n span,.cmp-p span{display:block;font-size:9.8px;color:var(--ink-3);line-height:1.5;white-space:nowrap}
.cmp-slash{font-size:15px;color:#c3d3dc;line-height:1;padding-bottom:13px}
.cmp-p b{display:block;font-size:18px;font-weight:700;color:var(--ink-2);line-height:1.4;font-variant-numeric:tabular-nums}
.cmp-rate{margin-left:auto;text-align:right;flex:none}
.cmp-rate b{display:block;font-size:16.5px;font-weight:700;color:var(--tone,#0d4a63);line-height:1.45;font-variant-numeric:tabular-nums}
.cmp-rate span{display:block;font-size:9.5px;color:var(--ink-3);line-height:1.4;white-space:nowrap}
.cmp-track{height:6px;border-radius:20px;background:#eef3f6;margin:8px 0 7px;overflow:hidden}
.cmp-track i{display:block;height:100%;border-radius:20px;background:var(--tone,#0d4a63);opacity:.8;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.cmp-foot{display:flex;align-items:center;gap:7px;font-size:10.3px;color:var(--ink-3);flex-wrap:nowrap;min-width:0}
.cmp-foot b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cmp-st{margin-left:auto;white-space:nowrap;font-weight:700;padding:0 8px;border-radius:20px;line-height:1.95;font-size:9.8px;flex:none}
.cmp-st.ok{background:var(--accent-soft);color:#0a7a5b}
.cmp-st.warn{background:var(--gold-soft);color:#9a6a10}
.cmp-st.muted{background:#f0f4f7;color:var(--ink-3);font-weight:600}
.cmp-note{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:9px 12px;border-radius:10px;
  background:var(--gold-soft);color:#7d5510;font-size:11.3px;line-height:1.85}
.cmp-note .ic{width:16px;height:16px;margin-top:2px;flex:none}
.cmp-note b{font-weight:700}
.cmp-note .btn{margin-left:2px;vertical-align:0}
@media(max-width:1080px){
  .cmp-grid{grid-template-columns:1fr}
  .cmp-tile{padding:12px 14px 10px 16px}
}
@media(max-width:640px){
  .dash-cmp .card-head{padding:13px 14px}
  .dash-cmp .card-body{padding:14px}
  .cmp-foot{flex-wrap:wrap}
  .cmp-st{margin-left:0}
}
.cmp-note.info{background:var(--blue-soft);color:#22478f}
/* ---------- Reports: clean grouped table + mobile cards ---------- */
.rep-body{overflow:hidden}
.rep-table-wrap{position:relative;overflow-x:auto}
.rep-table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px;font-size:12.5px}
.rep-table thead th{position:static;text-align:center;white-space:nowrap}

.rep-cards{display:none}

/* ===== v1.8: student cards + class rows ===== */

.scard{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(16,42,60,.04);transition:.16s;min-width:0}

.scard-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;background:#fafcfd;border:1px solid #eef4f7;border-radius:11px;padding:9px 11px}

.scard-badges{display:flex;gap:5px;flex-wrap:wrap;min-height:19px;align-items:center}

.theme-row{display:flex;align-items:center;gap:9px;width:100%;margin:0 0 8px;padding:8px 10px;border-radius:9px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#cfe3ee;font-size:12.5px;font-weight:600;
  text-align:left;line-height:1.4;transition:background .16s,color .16s,border-color .16s}
.theme-row:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.18);color:#fff}
.tt-ic{width:17px;height:17px;flex:none;position:relative}
.tt-ic svg{position:absolute;inset:0;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s,opacity .22s}
.tt-sun{opacity:0;transform:scale(.55) rotate(-40deg)}
.theme-row.on .tt-moon{opacity:0;transform:scale(.55) rotate(40deg)}
.theme-row.on .tt-sun{opacity:1;transform:none}
.tt-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-sw{position:relative;width:32px;height:18px;border-radius:20px;background:rgba(255,255,255,.20);flex:none;transition:background .2s}
.tt-sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .2s}
.theme-row.on .tt-sw{background:#2fd6a8}
.theme-row.on .tt-sw i{left:16px}

.bg-pick{margin:0 0 8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}

  transition:transform .14s,border-color .14s,box-shadow .14s}
.bp-dot:hover{transform:scale(1.12);border-color:rgba(255,255,255,.7)}
.bp-dot.on{border-color:#fff;box-shadow:0 0 0 2px rgba(47,214,168,.55)}

/* settings appearance card */
.bg-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.bg-opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;

.bg-opt .bo-ck svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;display:block}

.bg-custom-row .t span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.75}
.bg-custom-row .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

}
function loadDB() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    state.students = Array.isArray(o.students) ? o.students : [];
    state.settings = Object.assign(state.settings, o.settings || {});
    if (!state.settings.school) state.settings.school = 'សាលាបឋមសិក្សា រោគ';
    if (!state.settings.code || state.settings.code === 'SPS') state.settings.code = '01030401017';
    state.seq = o.seq || state.students.length;
  } catch (e) { console.warn(e); }
}

const BG_PRESETS = [
  { id: 'default', name: 'ស្តង់ដារ', h: 198, s: 24 },
  { id: 'sky', name: 'ខៀវមេឃ', h: 205, s: 78 },

  { id: 'violet', name: 'ស្វាយ', h: 262, s: 58 },
  { id: 'rose', name: 'ផ្កាឈូក', h: 334, s: 66 },
  { id: 'amber', name: 'ទឹកក្រូច', h: 36, s: 82 },
  { id: 'slate', name: 'ប្រផេះ', h: 212, s: 12 }
];
const hslCol = (h, s, l) => 'hsl(' + Math.round(h) + ', ' + Math.round(s) + '%, ' + Math.round(l) + '%)';
function hexToHsl(hex) {
  let v = String(hex || '').replace('#', '');
  if (v.length === 3) v = v.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(v)) return { h: 198, s: 30 };
  const r = parseInt(v.slice(0, 2), 16) / 255, g = parseInt(v.slice(2, 4), 16) / 255, b = parseInt(v.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (mx + mn) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return { h, s: s * 100 };
}
function bgState() { try { const o = JSON.parse(localStorage.getItem('sis_bg') || 'null'); return o && typeof o === 'object' ? o : null; } catch (e) { return null; } }
function bgSave(o) {
  try {
    if (!o || o.id === 'default') localStorage.removeItem('sis_bg');
    else localStorage.setItem('sis_bg', JSON.stringify(o));
  } catch (e) {}
}
function bgSpec(o) {
  if (!o || !o.id || o.id === 'default') return null;
  if (o.id === 'custom' && o.hex) { const q = hexToHsl(o.hex); return { h: q.h, s: Math.max(10, q.s) }; }
  const p = BG_PRESETS.find(x => x.id === o.id);
  return p ? { h: p.h, s: p.s } : null;
}
function bgColors(o) {
  const sp = bgSpec(o); if (!sp) return null;
  const h = sp.h, s = sp.s, dark = isDark();
  if (dark) return {
    bg: hslCol(h, Math.min(30, s * 0.42), 6.4),
    card: hslCol(h, Math.min(24, s * 0.32), 10.6),
    line: hslCol(h, Math.min(26, s * 0.34), 19),
    line2: hslCol(h, Math.min(26, s * 0.34), 24),
    acc: hslCol(h, Math.min(58, s * 0.95), 44),
    s0: hslCol(h, Math.min(26, s * 0.32), 7.8),
    s1: hslCol(h, Math.min(25, s * 0.33), 11.3),
    s2: hslCol(h, Math.min(26, s * 0.34), 13.6),
    s3: hslCol(h, Math.min(27, s * 0.36), 16.1),
    sa: hslCol(h, Math.min(28, s * 0.38), 18.6),
    b1: hslCol(h, Math.min(28, s * 0.37), 20.6),
    b2: hslCol(h, Math.min(29, s * 0.39), 24.6)
  };
  return {
    bg: hslCol(h, Math.min(46, s * 0.5), 95.4),
    card: hslCol(h, Math.min(30, s * 0.24), 99.6),
    line: hslCol(h, Math.min(38, s * 0.3), 88),
    line2: hslCol(h, Math.min(38, s * 0.3), 82),
    acc: hslCol(h, Math.min(70, s), 56)
  };
}
function applyBg(opt) {
  const root = document.documentElement;
  const o = opt === undefined ? bgState() : opt;
  const c = bgColors(o);
  const surf = ['--s0', '--s1', '--s2', '--s3', '--sa', '--b1', '--b2'];
  if (!c) {
    ['--bg', '--card', '--line', '--line-2', '--bg-accent'].concat(surf).forEach(k => root.style.removeProperty(k));
    root.removeAttribute('data-bg');
  } else {
    root.style.setProperty('--bg', c.bg);
    root.style.setProperty('--card', c.card);
    root.style.setProperty('--line', c.line);
    root.style.setProperty('--line-2', c.line2);
    root.style.setProperty('--bg-accent', c.acc);
    if (c.s0) { root.style.setProperty('--s0', c.s0); root.style.setProperty('--s1', c.s1); root.style.setProperty('--s2', c.s2); root.style.setProperty('--s3', c.s3); root.style.setProperty('--sa', c.sa); root.style.setProperty('--b1', c.b1); root.style.setProperty('--b2', c.b2); }
    else surf.forEach(k => root.style.removeProperty(k));
    root.setAttribute('data-bg', o && o.id ? o.id : 'custom');
  }
  syncBgUI(o);
}
function setBg(o) { bgSave(o); applyBg(o); }
function bgDot(h, s) { return 'background:linear-gradient(140deg,' + hslCol(h, Math.min(80, s + 12), 62) + ',' + hslCol(h, Math.min(80, s + 10), 44) + ')'; }
function syncBgUI(o) {
  const cur = (o && o.id) ? o.id : 'default';
  $$('[data-bg-set]').forEach(b => b.classList.toggle('on', b.dataset.bgSet === cur));

}

const PROFILE_KEYS = ['surname', 'name', 'gender', 'dob', 'grade', 'schoolYear', 'enrollDate', 'phone', 'cuVillage', 'fName', 'mName', 'nationality'];
function profilePct(s) {
  if (!s) return 0;
  const n = PROFILE_KEYS.filter(k => String(s[k] == null ? '' : s[k]).trim()).length;
  return Math.round(n / PROFILE_KEYS.length * 100);

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

function bmiValue(w, h) {
  w = num(w); h = num(h);
  if (w <= 0 || h <= 0) return null;
  return +(w / Math.pow(h / 100, 2)).toFixed(1);
}
function bmiCat(b) {
  if (b == null) return null;
  if (b < 18.5) return { t: 'ស្គម', c: 'amber' };
  if (b < 25) return { t: 'ធម្មតា', c: 'green' };
  if (b < 30) return { t: 'លើសទម្ងន់', c: 'amber' };
  return { t: 'ធាត់', c: 'red' };
}
function bmiHTML(w, h) {
  const b = bmiValue(w, h);
  if (b == null) return '<span class="pill gray">BMI —</span><span>បំពេញទម្ងន់ និងកម្ពស់</span>';
  const c = bmiCat(b);
  return `<span class="pill ${c.c}">BMI ${b}</span><span>${c.t}</span>`;
}
function fmtDate(d) {

}

}
function nextId() {
  const year = (state.settings.year || '').slice(0, 4) || String(new Date().getFullYear());
  const prefix = (state.settings.code || 'SIS').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'SIS';

  state.students.forEach(s => {
    const m = String(s.id || '').match(/(\d+)$/);
    if (m && String(s.id).startsWith(prefix + '-' + year)) max = Math.max(max, parseInt(m[1], 10));

/* ---------------- toasts ---------------- */
function toast(msg, type = 'ok', ms = 3200) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = icon(type === 'err' ? 'alert' : type === 'warn' ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(16px)'; el.style.transition = '.25s'; setTimeout(() => el.remove(), 260); }, ms);
}

    ctrl = `<input type="hidden" name="${f.k}" id="f_${f.k}" value="${esc(v)}">
      <div class="seg" data-seg="${f.k}">${f.opts.map(o => `<button type="button" data-v="${esc(o)}" class="${o === v ? 'on' : ''}">${esc(o)}</button>`).join('')}</div>`;
  } else if (f.type === 'select') {
    ctrl = `<select name="${f.k}" id="f_${f.k}"><option value="">— ជ្រើសរើស —</option>${f.opts.map(o => `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctrl = `<textarea name="${f.k}" id="f_${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else {
    const lid = f.list ? 'list_' + f.k : '';
    ctrl = `<input type="${f.type || 'text'}" name="${f.k}" id="f_${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${lid ? ` list="${lid}"` : ''}${f.type === 'tel' ? ' inputmode="tel"' : ''}>
      ${f.list ? `<datalist id="${lid}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
  }
  return `<div class="field ${cls}" data-field="${f.k}">${label}${ctrl}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}<span class="err-msg">សូមបំពេញព័ត៌មាននេះ</span></div>`;
}
function addrBlockHTML(f, r) {

  const pv = r[p + 'Province'] || '', dv = r[p + 'District'] || '', cv = r[p + 'Commune'] || '';
  const provOpts = (window.ADDR.p || []).map(x => `<option value="${x[0]}"${x[0] === pv ? ' selected' : ''}>${esc(x[1])}</option>`).join('');
  const distOpts = pv ? ((window.ADDR.d || {})[pv] || []).map(x => `<option value="${x[0]}"${x[0] === dv ? ' selected' : ''}>${esc(x[1])}</option>`).join('') : '';
  const comOpts = dv ? ((window.ADDR.c || {})[dv] || []).map(x => `<option value="${x[0]}"${x[0] === cv ? ' selected' : ''}>${esc(x[1])}</option>`).join('') : '';
  return `<div class="col-12"><div class="addr-block" data-prefix="${p}">

    <div class="form-grid">
      <div class="field col-3"><label>ខេត្ត/ក្រុង</label><select data-role="province" name="${p}Province"><option value="">— ជ្រើសរើស —</option>${provOpts}</select></div>
      <div class="field col-3"><label>ស្រុក/ខណ្ឌ</label><select data-role="district" name="${p}District"><option value="">— ជ្រើសរើស —</option>${distOpts}</select></div>
      <div class="field col-3"><label>ឃុំ/សង្កាត់</label><select data-role="commune" name="${p}Commune"><option value="">— ជ្រើសរើស —</option>${comOpts}</select></div>
      <div class="field col-3"><label>ភូមិ</label><input type="text" name="${p}Village" value="${esc(r[p + 'Village'] || '')}" placeholder="ឈ្មោះភូមិ"></div>
    </div></div></div>`;
}
function bmiBlockHTML(f, r) {
  return `<div class="field col-${f.col || 6}">
    <label>${esc(f.l)} <span style="font-weight:400;color:#93aab8">— ទម្ងន់ និងកម្ពស់</span></label>
    <div class="bmi-row">
      <input type="number" step="0.1" min="0" name="${f.w}" id="f_${f.w}" value="${esc(r[f.w] || '')}" placeholder="ទម្ងន់ (គ.ក)">
      <input type="number" step="0.1" min="0" name="${f.h}" id="f_${f.h}" value="${esc(r[f.h] || '')}" placeholder="កម្ពស់ (ស.ម)">
    </div>

}

function renderForm(rec) {
  const r = rec || blank();
  state.editingId = rec ? rec.id : null;
  const isEdit = !!rec;
  setTop(isEdit ? 'កែប្រែព័ត៌មានសិស្ស' : 'ចុះឈ្មោះសិស្សថ្មី',
    isEdit ? `កំពុងកែប្រែ៖ ${fullName(rec)} (${rec.id})` : 'បំពេញព័ត៌មាននៅក្នុងទម្រង់ខាងក្រោម — ចន្លោះដែលមានសញ្ញា * ត្រូវតែបំពេញ',
    `<button class="btn ghost" data-nav="list">${icon('chevL')} ត្រឡប់ក្រោយ</button>`);

  const idNote = isEdit

  const html = `
  <form id="studentForm" novalidate autocomplete="off">

    ${SECTIONS.map(sec => `
      <section class="form-section">
        <div class="fs-head">
          <div class="fs-num">${sec.no}</div>

          <div class="fs-ico">${icon(sec.icon)}</div>

      </section>`).join('')}

    <div class="form-actions">
      <div class="meta">ភាពពេញលេញ <b id="pctText">0%</b></div>
      <div class="progress"><i id="pctBar"></i></div>
      <div class="right">
        <button type="button" class="btn ghost" data-nav="list">បោះបង់</button>
        ${isEdit ? '' : `<button type="submit" class="btn navy" data-save="again">${icon('save')} រក្សាទុក និងបន្ត</button>`}
        <button type="submit" class="btn primary">${icon('check')} ${isEdit ? 'រក្សាទុកការកែប្រែ' : 'រក្សាទុក'}</button>

function fillDistrict(prefix, keepD, keepC) {
  const block = $(`.addr-block[data-prefix="${prefix}"]`);
  if (!block) return;
  const pv = block.querySelector('[data-role=province]').value;
  const dSel = block.querySelector('[data-role=district]');
  const cSel = block.querySelector('[data-role=commune]');
  const list = ((window.ADDR.d || {})[pv] || []);
  dSel.innerHTML = '<option value="">— ជ្រើសរើស —</option>' + list.map(x => `<option value="${x[0]}">${esc(x[1])}</option>`).join('');
  cSel.innerHTML = '<option value="">— ជ្រើសរើស —</option>';
  if (keepD) dSel.value = keepD;
  fillCommune(prefix, keepC);
}
function fillCommune(prefix, keep) {
  const block = $(`.addr-block[data-prefix="${prefix}"]`);
  if (!block) return;
  const dv = block.querySelector('[data-role=district]').value;
  const cSel = block.querySelector('[data-role=commune]');
  const list = ((window.ADDR.c || {})[dv] || []);
  cSel.innerHTML = '<option value="">— ជ្រើសរើស —</option>' + list.map(x => `<option value="${x[0]}">${esc(x[1])}</option>`).join('');
  if (keep) cSel.value = keep;
}

function wireForm() {
  const form = $('#studentForm');
  if (!form) return;

  $$('.seg', form).forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if (!b) return;
      $$('button', seg).forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const inp = form.querySelector(`[name="${seg.dataset.seg}"]`);
      inp.value = b.dataset.v;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      const fw = seg.closest('.field');
      if (fw) fw.classList.remove('error');
    });
  });

  $$('.addr-block', form).forEach(block => {
    const p = block.dataset.prefix;
    block.querySelector('[data-role=province]').addEventListener('change', () => fillDistrict(p));
    block.querySelector('[data-role=district]').addEventListener('change', () => fillCommune(p));
    const cp = block.querySelector('.copy-btn');
    if (cp) cp.addEventListener('click', () => {
      const src = cp.dataset.copy;
      const sb = $(`.addr-block[data-prefix="${src}"]`);
      if (!sb) return;
      const pv = sb.querySelector('[data-role=province]').value;
      const dv = sb.querySelector('[data-role=district]').value;
      const cv = sb.querySelector('[data-role=commune]').value;
      const vv = sb.querySelector('[name$=Village]').value;
      block.querySelector('[data-role=province]').value = pv;
      fillDistrict(p, dv, cv);
      block.querySelector('[name$=Village]').value = vv;
      toast('បានចម្លងអាសយដ្ឋាន', 'ok', 1800);
    });
  });

  $$('[data-bmi]', form).forEach(box => {
    const k = box.dataset.bmi;
    const wEl = form.querySelector(`[name="${k}"]`);
    const hEl = form.querySelector(`[name="${k === 'w1' ? 'h1' : 'h2'}"]`);
    if (!wEl || !hEl) return;
    const upd = () => { box.innerHTML = bmiHTML(wEl.value, hEl.value); };
    wEl.addEventListener('input', upd); hEl.addEventListener('input', upd);
  });

  form.addEventListener('input', updateProgress);
  form.addEventListener('change', updateProgress);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const again = (e.submitter && e.submitter.dataset.save === 'again');
    saveStudent(again);
  });
  updateProgress();
}

function collect() {
  const form = $('#studentForm');
  const d = {};
  SECTIONS.forEach(sec => sec.fields.forEach(f => {
    if (f.type === 'subhead') return;
    if (f.type === 'addr') {
      const b = form.querySelector(`.addr-block[data-prefix="${f.prefix}"]`);
      d[f.prefix + 'Province'] = b.querySelector('[data-role=province]').value;
      d[f.prefix + 'District'] = b.querySelector('[data-role=district]').value;
      d[f.prefix + 'Commune'] = b.querySelector('[data-role=commune]').value;
      d[f.prefix + 'Village'] = b.querySelector('[name$=Village]').value.trim();
      return;
    }
    if (f.type === 'bmi') {
      d[f.w] = form.querySelector(`[name="${f.w}"]`).value;
      d[f.h] = form.querySelector(`[name="${f.h}"]`).value;
      d[f.k] = bmiValue(d[f.w], d[f.h]);
      return;
    }
    const el = form.querySelector(`[name="${f.k}"]`);
    d[f.k] = el ? el.value.trim() : '';
  }));
  return d;
}

function validate(d) {
  const req = [['surname', 'គោត្តនាម'], ['name', 'នាម'], ['gender', 'ភេទ'], ['dob', 'ថ្ងៃខែឆ្នាំកំណើត']];
  const errs = [];
  req.forEach(([k]) => { if (!d[k]) errs.push(k); });
  if (d.dob && new Date(d.dob) > new Date()) errs.push('dob');
  if (d.phone && !/^[0-9+\s\-()]{6,20}$/.test(d.phone)) errs.push('phone');
  return [...new Set(errs)];
}

function saveStudent(again) {
  const form = $('#studentForm');
  $$('.field', form).forEach(f => f.classList.remove('error'));
  const d = collect();
  const errs = validate(d);
  if (errs.length) {
    errs.forEach(k => { const fw = form.querySelector(`[data-field="${k}"]`); if (fw) fw.classList.add('error'); });
    const first = form.querySelector('.field.error');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast(errs.includes('phone') ? 'សូមពិនិត្យលេខទូរស័ព្ទឡើងវិញ' : 'សូមបំពេញព័ត៌មានចាំបាច់ឱ្យបានគ្រប់គ្រាន់', 'err');
    return;
  }
  const dup = state.students.find(s => s.id !== state.editingId && s.surname === d.surname && s.name === d.name && s.dob === d.dob);
  const finish = () => {
    if (state.editingId) {
      const i = state.students.findIndex(s => s.id === state.editingId);
      state.students[i] = Object.assign({}, state.students[i], d, { updatedAt: new Date().toISOString() });
      persist(); toast('បានរក្សាទុកការកែប្រែ', 'ok');
      location.hash = '#/list';
    } else {
      const id = nextId();
      state.students.push(Object.assign({ id, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, d));
      state.seq = state.students.length;
      persist();
      toast(`បានចុះឈ្មោះ ${fullName(d)} ដោយជោគជ័យ`, 'ok');
      if (again) { location.hash = '#/form'; renderForm(null); window.scrollTo({ top: 0, behavior: 'smooth' }); updateSideBadge(); }
      else { location.hash = '#/list'; }
    }
    updateSideBadge();
  };
  if (dup) {
    confirmBox({ title: 'ព័ត៌មានស្ទួន?', msg: `មានសិស្សឈ្មោះ <b>${esc(fullName(d))}</b> ថ្ងៃកំណើត ${fmtDate(d.dob)} រួចហើយ (${esc(dup.id)})។ តើចង់បន្តរក្សាទុកដែរឬទេ?`, ok: 'បន្តរក្សាទុក', danger: false }).then(ok => { if (ok) finish(); });
  } else finish();
}

function updateProgress() {
  const form = $('#studentForm');
  if (!form) return;
  const inputs = $$('input:not([type=hidden]):not([type=checkbox]), select, textarea', form).filter(i => i.type !== 'hidden');
  const filled = inputs.filter(i => String(i.value).trim() !== '').length;
  const pct = inputs.length ? Math.round(filled / inputs.length * 100) : 0;
  const bar = $('#pctBar'), txt = $('#pctText');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = pct + '%';
}

<script>
/* =========================================================
   ការនាំចូលទិន្នន័យ (Import) — គាំទ្រទម្រង់ច្រើន
   ១) Backup របស់កម្មវិធីនេះ { students:[...] }
   ២) បញ្ជី JSON ធម្មតា [ {...}, {...} ]
   ៣) Backup ប្រព័ន្ធចាស់ដែលមាន values:[...] (តាមលំដាប់វាល)
   ========================================================= */

const KH_DIGITS = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
const ADDR_PREFIXES = ['រាជធានី', 'ខេត្ត', 'ក្រុង', 'ស្រុក', 'ខណ្ឌ', 'ឃុំ', 'សង្កាត់', 'ភូមិ'];

function impNorm(v) {
  return String(v == null ? '' : v)
    .replace(/[\u200b-\u200d\ufeff]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function impKey(v) {
  let s = impNorm(v);
  ADDR_PREFIXES.forEach(p => { if (s.startsWith(p)) s = s.slice(p.length).trim(); });
  return s.replace(/\s+/g, '');
}
function impFind(list, name) {
  const k = impKey(name);
  if (!k) return null;
  const arr = list || [];
  let hit = arr.find(x => impKey(x[1]) === k);
  if (hit) return hit;
  hit = arr.find(x => impKey(x[1]).includes(k) || k.includes(impKey(x[1])));
  return hit || null;
}
function impAddr(prov, dist, comm, village) {
  const p = impFind((window.ADDR && ADDR.p) || [], prov);
  const d = p ? impFind((ADDR.d || {})[p[0]] || [], dist) : null;
  const c = d ? impFind((ADDR.c || {})[d[0]] || [], comm) : null;
  return {
    p: p ? p[0] : '', d: d ? d[0] : '', c: c ? c[0] : '',
    village: impNorm(village) || (!c && !d && !p ? impNorm([village, comm, dist, prov].filter(Boolean).join(' ')) : '')
  };
}
function impYes(v) {
  const s = impNorm(v).toLowerCase();
  return ['មាន', 'បាទ/ចាស', 'បាទ', 'ចាស', 'yes', 'true', '1', 'y'].includes(s);
}
function impNo(v) {
  const s = impNorm(v).toLowerCase();
  return ['មិនមាន', 'ទេ', 'គ្មាន', 'no', 'false', '0', 'n', ''].includes(s);
}
function impNumber(v) {
  const m = String(v == null ? '' : v).replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? m[0] : '';
}
function impDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'object' && v.seconds != null) {
    const d = new Date(Number(v.seconds) * 1000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  if (typeof v === 'object' && v._seconds != null) {
    const d = new Date(Number(v._seconds) * 1000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  let s = impNorm(v);
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (m) {
    let a = +m[1], b = +m[2];
    let mo = a, da = b;
    if (a > 12 && b <= 12) { da = a; mo = b; }
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return '';
    return `${m[3]}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
  }
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function impStamp(v, fallback) {
  if (typeof v === 'object' && v && v.seconds != null) return new Date(Number(v.seconds) * 1000).toISOString();
  if (typeof v === 'object' && v && v._seconds != null) return new Date(Number(v._seconds) * 1000).toISOString();
  if (typeof v === 'string' && v) { const d = new Date(v); if (!isNaN(d)) return d.toISOString(); }
  return fallback;
}
function impGrade(v) {
  const s = impNorm(v);
  if (!s) return '';
  if (GRADES.includes(s)) return s;
  if (/មត្តេយ្យ|មត្តេ|kindergarten|kg/i.test(s)) return 'មត្តេយ្យ';
  const m = s.match(/\d+|[០-៩]+/);
  if (m) {
    const raw = m[0].replace(/[០-៩]/g, ch => String('០១២៣៤៥៦៧៨៩'.indexOf(ch)));
    const n = parseInt(raw, 10);
    if (n >= 1 && n <= 12) return 'ថ្នាក់ទី' + KH_DIGITS[n];
  }
  return '';
}
function impGender(v) {
  const s = impNorm(v);
  if (/ស្រី|female|^f$/i.test(s)) return 'ស្រី';
  if (/ប្រុស|male|^m$/i.test(s)) return 'ប្រុស';
  return '';
}
function impEye(v) {
  const s = impNorm(v);
  if (!s) return '';
  if (/ល្អ|ធម្មតា|normal/.test(s)) return 'ធម្មតា';
  if (/ខ្សោយ|weak/.test(s)) return 'ខ្សោយ';
  if (/ពិការ|blind/.test(s)) return 'ពិការ';
  if (/មិន|not|no/.test(s)) return 'មិនបានពិនិត្យ';
  return '';
}
function impGuardianType(v) {
  const s = impNorm(v);
  if (GUARDIAN_TYPES.includes(s)) return s;
  if (/ម្ដាយ|ម្តាយ|mother/.test(s)) return 'ម្ដាយ';
  if (/ឪពុក|father/.test(s)) return 'ឪពុក';
  if (/ជីដូន|ជីតា/.test(s)) return /ដូន/.test(s) ? 'ជីដូន' : 'ជីតា';
  if (!s) return '';
  return 'ផ្សេងៗ';
}
function impClean(v, max) {
  const s = impNorm(v);
  return max ? s.slice(0, max) : s;
}

/* ---------- អានឯកសារ ---------- */
function parseImportPayload(text) {
  const clean = String(text || '').replace(/^\uFEFF/, '');
  let o;
  try { o = JSON.parse(clean); } catch (e) { throw new Error('ឯកសារនេះមិនមែនជា JSON ត្រឹមត្រូវទេ'); }
  let arr = null;
  if (Array.isArray(o)) arr = o;
  else if (o && Array.isArray(o.students)) arr = o.students;
  else if (o && Array.isArray(o.data)) arr = o.data;
  else if (o && Array.isArray(o.records)) arr = o.records;
  else if (o && Array.isArray(o.items)) arr = o.items;
  if (!arr) throw new Error('រកមិនឃើញបញ្ជីសិស្សនៅក្នុងឯកសារនេះទេ');

  const students = [], bad = [];
  arr.forEach(item => {
    const s = impRecord(item);
    if (s) students.push(s); else bad.push(item);
  });
  return { settings: (o && o.settings) || null, students, bad, total: arr.length, population: (o && Array.isArray(o.population)) ? o.population : null };
}

function impNameKey(s) {
  return [impNorm(s.surname), impNorm(s.name), impNorm(s.dob)].join('|').toLowerCase();
}

function importBackupText(text) {
  let parsed;
  try { parsed = parseImportPayload(text); }
  catch (e) { toast(e.message || 'ឯកសារមិនត្រឹមត្រូវ', 'err', 4000); return; }

  const existingIds = new Set(state.students.map(s => String(s.id || '')));
  const existingKeys = new Set(state.students.map(impNameKey));
  const seenIds = new Set();
  const idDob = new Set(state.students.map(s => `${s.id}|${s.dob || ''}|${s.gender || ''}`));
  const seenKeys = new Set();
  const fresh = [];
  let dup = 0;
  const popCount = (parsed.population || []).length;

  let conflict = 0;
  parsed.students.forEach(s => {
    const key = impNameKey(s);
    const code = s._importCode || '';
    /* ស្ទួន = មនុស្សតែមួយ (ឈ្មោះ + ថ្ងៃខែឆ្នាំកំណើត) */
    if (existingKeys.has(key) || seenKeys.has(key)) { dup++; return; }
    /* លេខសិស្ស + ថ្ងៃកំណើត + ភេទ ដូចគ្នា → ជាមនុស្សតែមួយ (ឈ្មោះអាចសរសេរខុសគ្នា) */
    if (code && idDob.has(`${code}|${s.dob || ''}|${s.gender || ''}`)) { dup++; return; }
    /* លេខសិស្សដូចគ្នា តែជាមនុស្សផ្សេង → បន្ថែមលេខបន្ត */
    let id = code;
    if (id && (existingIds.has(id) || seenIds.has(id))) {
      let n = 2, cand = id + '-' + n;
      while (existingIds.has(cand) || seenIds.has(cand)) { n++; cand = id + '-' + n; }
      id = cand; conflict++;
    }
    if (id) { s.id = id; seenIds.add(id); idDob.add(`${id}|${s.dob || ''}|${s.gender || ''}`); }
    seenKeys.add(key);
    fresh.push(s);
  });

  const gradeCount = {};
  fresh.forEach(s => { const g = s.grade || 'គ្មានថ្នាក់'; gradeCount[g] = (gradeCount[g] || 0) + 1; });
  const gradeLine = Object.keys(gradeCount).slice(0, 6).map(g => `${esc(g)} <b>${gradeCount[g]}</b>`).join(' · ');

  const rows = fresh.slice(0, 5).map(s => `<li>${esc([s.surname, s.name].filter(Boolean).join(' '))}${s.dob ? ' — ' + esc(fmtDate(s.dob)) : ''}${s.grade ? ' — ' + esc(s.grade) : ''}</li>`).join('');

  const msg = `
    <div style="font-size:13px;line-height:2">
      ឯកសារមាន <b>${parsed.total}</b> កំណត់ត្រា។<br>
      ថ្មីត្រូវបញ្ចូល <b style="color:#0b7a5d">${fresh.length}</b> · ស្ទួន/មានរួច <b>${dup}</b>${popCount ? ` · ប្រជាជន <b>${popCount}</b>` : ''}${conflict ? ` · លេខសិស្សស្ទួន <b>${conflict}</b>` : ''}${parsed.bad.length ? ` · អានមិនបាន <b>${parsed.bad.length}</b>` : ''}
      ${gradeLine ? `<div style="margin-top:6px;color:#5b7487">តាមថ្នាក់៖ ${gradeLine}</div>` : ''}
      ${rows ? `<div style="margin-top:8px;color:#5b7487">ឧទាហរណ៍៖</div><ul style="margin:2px 0 0 18px;color:#334">${rows}</ul>` : ''}
      ${fresh.length ? '' : '<div style="margin-top:8px;color:#a5283a">គ្មានកំណត់ត្រាថ្មីត្រូវបញ្ចូលទេ។</div>'}
    </div>`;

  if (!fresh.length && !popCount) { toast('គ្មានកំណត់ត្រាថ្មីត្រូវបញ្ចូលទេ — សិស្សទាំងអស់មានរួចហើយ', 'warn', 4200); return; }

  confirmBox({ title: 'នាំចូលទិន្នន័យសិស្ស', msg, ok: `បញ្ចូល ${fresh.length} កំណត់ត្រា`, cancel: 'បោះបង់', danger: false }).then(ok => {
    if (!ok) return;
    fresh.forEach(s => { delete s._importCode; if (!s.id) s.id = nextId(); state.students.push(s); });
    if (popCount && typeof popMergeRecords === 'function') { popMergeRecords(parsed.population); }
    if (parsed.settings && !state.settings.school) state.settings = Object.assign(state.settings, parsed.settings);
    persist(); updateSideBadge(); route();
    toast(`បាននាំចូល ${fresh.length} កំណត់ត្រា${dup ? ` · រំលងស្ទួន ${dup}` : ''}`, 'ok', 4200);
  });
}

async function cloudToken(force) {

  if (!force && c.idToken && Date.now() < (c.exp || 0) - 120000) return c.idToken;

  const j = await cloudFetchJson(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(c.apiKey)}`, {

    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(c.refreshToken)}`
  });
  const exp = Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000;
  cloudSaveCfg({ idToken: j.id_token, refreshToken: j.refresh_token || c.refreshToken, exp });
  return j.id_token;
}
