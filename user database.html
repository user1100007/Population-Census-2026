/* ---------- Firestore (REST) ---------- */
function cloudFsBase() {
  const c = cloudCfg();
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.pid)}/databases/${encodeURIComponent(c.dbId)}/documents`;
}
function toFSValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFSValue) } };
  if (typeof v === 'object') {
    const f = {};
    Object.keys(v).forEach(k => { if (v[k] !== undefined) f[k] = toFSValue(v[k]); });
    return { mapValue: { fields: f } };
  }
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  return { stringValue: String(v) };
}
function toFS(obj) {
  const f = {};
  Object.keys(obj || {}).forEach(k => { if (obj[k] !== undefined) f[k] = toFSValue(obj[k]); });
  return { fields: f };
}
function fromFS(doc) {
  const out = {};
  const f = (doc && doc.fields) || {};
  Object.keys(f).forEach(k => {
    const v = f[k] || {};
    if ('stringValue' in v) out[k] = v.stringValue;
    else if ('integerValue' in v) out[k] = parseInt(v.integerValue, 10);
    else if ('doubleValue' in v) out[k] = Number(v.doubleValue);
    else if ('booleanValue' in v) out[k] = !!v.booleanValue;
    else if ('timestampValue' in v) out[k] = v.timestampValue;
    else if ('nullValue' in v) out[k] = null;
    else if ('mapValue' in v) out[k] = fromFS({ fields: (v.mapValue || {}).fields || {} });
    else if ('arrayValue' in v) out[k] = ((v.arrayValue || {}).values || []).map(x => fromFS({ fields: { _: x } })._);
  });
  return out;
}

async function cloudReq(path, opts = {}, retried) {
  const c = cloudCfg();
  const t = await cloudToken(false);
  const url = path.startsWith('http') ? path : cloudFsBase() + path;
  let r;
  try {
    r = await fetch(url, Object.assign({}, opts, {
      headers: Object.assign({ Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, opts.headers || {})
    }));
  } catch (e) { throw new Error('មិនអាចភ្ជាប់អ៊ីនធឺណិតបានទេ'); }
  if (r.status === 401 && !retried) { await cloudToken(true); return cloudReq(path, opts, true); }
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok) {
    const errObj = (j && j.error) || {};
    const code = errObj.status || errObj.message || ('HTTP ' + r.status);
    const extra = code === 'PERMISSION_DENIED' && !c.dbId ? '' : '';
    throw new Error((cloudErrText(String(code).split(' ')[0]) || String(errObj.message || code)) + extra);
  }
  return j || {};
}

/* អាន collection ទាំងមូល (បំបែកទំព័រ) */
async function cloudListCollection(col, pageSize) {
  const out = [];
  let token = '', guard = 0;
  do {
    const qs = `?pageSize=${pageSize || 300}${token ? '&pageToken=' + encodeURIComponent(token) : ''}`;
    const j = await cloudReq(`/${encodeURIComponent(col)}${qs}`, { method: 'GET' });
    (j.documents || []).forEach(d => {
      const o = fromFS(d);
      o.__doc = decodeURIComponent(String(d.name || '').split('/').pop() || '');
      out.push(o);
    });
    token = j.nextPageToken || '';
    guard++;
  } while (token && guard < 20);
  return out;
}

/* សរសេរដោយ updateMask → មិនបំផ្លាញវាលផ្សេងដែលមានស្រាប់ */
async function cloudUpsert(col, docId, obj) {
  const keys = Object.keys(obj).filter(k => obj[k] !== undefined);
  if (!keys.length) return;
  const mask = keys.map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  await cloudReq(`/${encodeURIComponent(col)}/${encodeURIComponent(docId)}?${mask}`, {
    method: 'PATCH', body: JSON.stringify(toFS(obj))
  });
}

/* ---------- ការបំប្លែង៖ សិស្ស ---------- */
function cStr(v, max) { const s = String(v == null ? '' : v).trim(); return max ? s.slice(0, max) : s; }

function cAge(dob) {

  const d = new Date(String(dob) + 'T00:00:00');
  if (isNaN(d)) return null;
  const t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--;
  return a >= 0 && a <= 130 ? a : null;
}

/* ---------- សមកាលកម្ម ---------- */
function stuNameKey(nm, dob) {
  const n = String(nm || '').replace(/\s+/g, '').toLowerCase();
  return n ? n + '|' + String(dob || '') : '';
}

async function cloudSync(opts = {}) {
  if (!cloudConnected()) { cloudSetStatus('off'); if (opts.manual) toast('សូមភ្ជាប់គណនី Cloud ជាមុន', 'warn'); return null; }
  if (cloud.busy) return null;
  const cfg = cloudCfg();
  cloud.busy = true; cloudSetStatus('sync');
  const res = { stuAdd: 0, stuUpd: 0, stuPush: 0, citAdd: 0, citUpd: 0, citPush: 0, remoteStu: 0, remoteCit: 0 };
  try {
    /* ---- សិស្ស ---- */
    const remoteStu = await cloudListCollection(cfg.colStu);
    res.remoteStu = remoteStu.filter(d => !d._deleted).length;
    const byDoc = new Map(), byCode = new Map(), byName = new Map();
    remoteStu.forEach(d => {
      if (d.__doc) byDoc.set(d.__doc, d);
      const code = cStr(d.studentCode || d.id).toLowerCase();
      if (code) byCode.set(code, d);
      const nk = stuNameKey(d.name, d.dob);
      if (nk) byName.set(nk, d);
    });
    const used = new Set(), toPush = [];
    state.students.forEach(s => {
      let d = s.fsid ? byDoc.get(s.fsid) : null;
      if (!d) d = byCode.get(cStr(s.id).toLowerCase()) || byCode.get(cStr(s.studentCode).toLowerCase());
      if (!d) d = byName.get(stuNameKey(fullName(s), s.dob));
      if (d) {
        if (d.__doc) used.add(d.__doc);
        s.fsid = d.__doc || s.fsid;
        if (d._deleted) {
          if (cloudTime(d.updatedAt) >= cloudTime(s.updatedAt)) {
            s._drop = true;
            return;
          }
          toPush.push(s); return;
        }
        const rt = cloudTime(d.updatedAt), lt = cloudTime(s.updatedAt);
        if (rt > lt) {
          Object.assign(s, fsToStu(d));
          s.updatedAt = d.updatedAt || s.updatedAt;
          s.fsid = d.__doc || s.fsid;
          res.stuUpd++;
        } else if (lt > rt) toPush.push(s);
      } else {
        toPush.push(s);
      }
    });
    if (state.students.some(s => s._drop)) {
      state.students = state.students.filter(s => !s._drop);
      res.stuUpd++;
    }
    const existIds = new Set(state.students.map(s => cStr(s.id).toLowerCase()));
    remoteStu.forEach(d => {
      if (d._deleted || !d.__doc || used.has(d.__doc)) return;
      const nu = fsToStu(d);
      if (!nu.surname && !nu.name) return;
      let nid = cStr(d.id) || d.__doc;
      if (existIds.has(nid.toLowerCase())) nid = d.__doc;
      nu.id = nid; existIds.add(nid.toLowerCase());
      nu.fsid = d.__doc;
      nu.createdAt = d.createdAt || new Date().toISOString();
      nu.updatedAt = d.updatedAt || new Date().toISOString();
      state.students.push(nu);
      res.stuAdd++;
    });
    if (res.stuAdd || res.stuUpd) _cloudPersistLocal();
    for (const s of toPush) {
      const docId = s.fsid || cStr(s.id);
      if (!docId) continue;
      await cloudUpsert(cfg.colStu, docId, stuToFS(s));
      s.fsid = docId;
      if (!s.updatedAt) s.updatedAt = new Date().toISOString();
      res.stuPush++;
    }
    if (res.stuPush) _cloudPersistLocal();

    /* ---- ប្រជាជន ---- */
    if (cfg.syncCit !== false && typeof POP !== 'undefined' && POP && Array.isArray(POP.records)) {
      let remoteCit = [];
      try { remoteCit = await cloudListCollection(cfg.colCit); } catch (e) { remoteCit = []; }
      res.remoteCit = remoteCit.length;
      remoteCit.forEach(d => { const n = Number(d.id); if (isFinite(n)) cloud.cidMax = Math.max(cloud.cidMax, n); });
      if (remoteCit.length && POP.sample) { POP.records = []; POP.sample = false; }
      const cById = new Map(), cByKey = new Map();
      remoteCit.forEach(d => {
        const n = Number(d.id); if (isFinite(n)) cById.set(n, d);
        const k = stuNameKey(d.name, d.dob); if (k) cByKey.set(k, d);
      });
      const cUsed = new Set(), toPushCit = [];
      POP.records.forEach(r => {
        let d = r.cid ? cById.get(Number(r.cid)) : null;
        if (!d) d = cByKey.get(stuNameKey(r.name, r.dob));
        if (d) {
          cUsed.add(d);
          if (Number(d.id)) r.cid = Number(d.id);
          const rt = cloudTime(d.updatedAt), lt = cloudTime(r.updatedAt);
          if (rt > lt) {
            const patch = fsToCit(d);
            ['name', 'dob', 'relation', 'job', 'household', 'school', 'village', 'enroll'].forEach(k => { if (patch[k]) r[k] = patch[k]; });
            if (patch.gender) r.gender = patch.gender;
            r.updatedAt = d.updatedAt || r.updatedAt;
            res.citUpd++;
          } else if (lt > rt) toPushCit.push(r);
        } else toPushCit.push(r);
      });
      remoteCit.forEach(d => {
        if (cUsed.has(d)) return;
        const r = fsToCit(d);
        if (!r.name) return;
        POP.records.push(r);
        cUsed.add(d);
        res.citAdd++;
      });
      for (const r of toPushCit) {
        if (!r.name) continue;
        if (!Number(r.cid)) r.cid = citNextId();
        await cloudUpsert(cfg.colCit, String(r.cid), citToFS(r));
        r.updatedAt = new Date().toISOString();
        res.citPush++;
      }
      if (res.citAdd || res.citUpd || res.citPush) {
        POP.sample = false;
        try { popSave(); } catch (e) {}
        const pcEl = $('#popCount'); if (pcEl) pcEl.textContent = POP.records.length;
        if (state.view === 'population' && typeof route === 'function') route();
      }
    }

    cloud.last = new Date();
    cloud.stats = res;
    cloudSetStatus('ok', '');
    if (typeof updateSideBadge === 'function') updateSideBadge();
    if ((res.stuAdd || res.stuUpd) && state.view !== 'form' && state.view !== 'population') route();
    if (opts.manual) {
      const bits = [];
      if (res.stuAdd) bits.push(`សិស្សថ្មី ${res.stuAdd}`);
      if (res.stuUpd) bits.push(`សិស្សកែ ${res.stuUpd}`);
      if (res.stuPush) bits.push(`សិស្សផ្ទុកឡើង ${res.stuPush}`);
      if (res.citAdd) bits.push(`ប្រជាជនថ្មី ${res.citAdd}`);
      if (res.citUpd) bits.push(`ប្រជាជនកែ ${res.citUpd}`);
      if (res.citPush) bits.push(`ប្រជាជនផ្ទុកឡើង ${res.citPush}`);
      toast(bits.length ? 'សមកាលរួចរាល់៖ ' + bits.join(' · ') : 'ទិន្នន័យគ្រប់ទីកន្លែងដូចគ្នាហើយ', 'ok', 4200);
    }
    return res;
  } catch (e) {
    cloudSetStatus('err', e.message);
    if (opts.manual) toast(e.message, 'err', 4600);
    return null;
  } finally {
    cloud.busy = false;
    if (state.view === 'settings') renderSettings();
  }
}

function _cloudPersistLocal() {
  try { localStorage.setItem(KEY, JSON.stringify({ students: state.students, settings: state.settings, seq: state.seq })); }
  catch (e) {}
}

function cloudSchedule() {
  if (!cloudConnected()) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(() => { cloudSync({ manual: false }); }, 1500);
}

async function cloudPushAll() {
  if (!cloudConnected()) { toast('សូមភ្ជាប់គណនី Cloud ជាមុន', 'warn'); return; }
  if (cloud.busy) return;
  cloud.busy = true; cloudSetStatus('sync');
  try {
    let n = 0;
    for (const s of state.students) {
      const docId = s.fsid || cStr(s.id);
      if (!docId) continue;
      await cloudUpsert(cloudCfg().colStu, docId, stuToFS(s));
      s.fsid = docId; n++;
    }
    _cloudPersistLocal();
    cloud.last = new Date(); cloudSetStatus('ok', '');
    toast(`បានផ្ទុកឡើង ${n} កំណត់ត្រាសិស្សទៅ Cloud`, 'ok');
  } catch (e) { cloudSetStatus('err', e.message); toast(e.message, 'err', 4600); }
  finally { cloud.busy = false; renderCloudChips(); if (state.view === 'settings') renderSettings(); }
}

async function cloudCitPull() {
  if (!cloudConnected()) { toast('សូមភ្ជាប់គណនី Cloud ជាមុន', 'warn'); return; }
  if (cloud.busy) return;
  cloud.busy = true; cloudSetStatus('sync');
  try {
    const remote = await cloudListCollection(cloudCfg().colCit);
    remote.forEach(d => { const n = Number(d.id); if (isFinite(n)) cloud.cidMax = Math.max(cloud.cidMax, n); });
    if (remote.length) { POP.records = remote.map(fsToCit).filter(r => r.name); POP.sample = false; }
    try { popSave(); } catch (e) {}
    cloud.last = new Date(); cloudSetStatus('ok', '');
    toast(`បានទាញទិន្នន័យប្រជាជន ${POP.records.length} នាក់ពី Cloud`, 'ok');
    route();
  } catch (e) { cloudSetStatus('err', e.message); toast(e.message, 'err', 4600); }
  finally { cloud.busy = false; renderCloudChips(); if (state.view === 'settings') renderSettings(); }
}

async function cloudCitPush() {
  if (!cloudConnected()) { toast('សូមភ្ជាប់គណនី Cloud ជាមុន', 'warn'); return; }
  if (cloud.busy) return;
  cloud.busy = true; cloudSetStatus('sync');
  try {
    let n = 0, fail = 0;
    for (const r of POP.records) {
      if (!r.name) continue;
      if (!Number(r.cid)) r.cid = citNextId();
      try { await cloudUpsert(cloudCfg().colCit, String(r.cid), citToFS(r)); n++; }
      catch (e) { fail++; }
    }
    try { popSave(); } catch (e) {}
    cloud.last = new Date(); cloudSetStatus('ok', '');
    toast(fail ? `ផ្ទុកបាន ${n} នាក់ · បរាជ័យ ${fail} នាក់ (សូមពិនិត្យ Rules)` : `បានផ្ទុកប្រជាជន ${n} នាក់ទៅ Cloud`, fail ? 'warn' : 'ok', 4600);
  } catch (e) { cloudSetStatus('err', e.message); toast(e.message, 'err', 4600); }
  finally { cloud.busy = false; renderCloudChips(); if (state.view === 'settings') renderSettings(); }
}

/* ហៅមុនពេលលុបទាំងអស់ — បង្កើតស្លាកលុបនៅលើ Cloud */
async function cloudTombstoneAll() {
  if (!cloudConnected() || !state.students.length) return;
  const now = new Date().toISOString();
  try {
    for (const s of state.students) {
      const docId = s.fsid || cStr(s.id);
      if (!docId) continue;
      await cloudUpsert(cloudCfg().colStu, docId, { id: cStr(s.id), _deleted: true, updatedAt: now });
    }
    cloud.last = new Date();
  } catch (e) { cloudSetStatus('err', e.message); }
}

/* រាល់ការរក្សាទុកក្នុងឧបករណ៍ → កំណត់ពេលផ្ទុកទៅ Cloud */
const _basePersist = persist;
persist = function () {
  _basePersist.apply(null, arguments);
  try { cloudSchedule(); } catch (e) {}
};

/* ---------- ចាប់ផ្តើម ---------- */
(function cloudBoot() {
  setTimeout(() => {
    renderCloudChips();
    if (cloudConnected()) {
      cloudSetStatus('sync');
      cloudSync({ manual: false }).then(() => {
        if (state.view === 'settings') renderSettings();
      });
    }
    setInterval(() => {
      const c = cloudCfg();
      if (c.auto && cloudConnected() && !document.hidden) cloudSync({ manual: false });
    }, 25000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && cloudCfg().auto && cloudConnected()) cloudSync({ manual: false });
    });
  }, 1200);
})();

/* ---------- storage ---------- */
function popLoad() {
  try {
    const raw = localStorage.getItem(POP_KEY);
    if (raw) {
      const o = JSON.parse(raw) || {};
      POP.records = Array.isArray(o.records) ? o.records : [];
      POP.sample = !!o.sample;
      POP.updatedAt = o.updatedAt || '';
      return;
    }
  } catch (e) { /* ignore */ }
  popSeed();
}
function popSeed() {
  POP.records = POP_SEED.map((a, i) => ({
    pid: 'P' + (i + 1), name: a[0], gender: a[1], dob: a[2], relation: a[3], job: a[4], household: a[5], school: a[6], note: ''
  }));
  POP.sample = true;
  popSave();
}
function popSave() {
  POP.updatedAt = new Date().toISOString();
  try { localStorage.setItem(POP_KEY, JSON.stringify(POP)); } catch (e) { /* ignore */ }
}

/* ---------- helpers ---------- */
function popNorm(v) {
  return String(v == null ? '' : v).replace(/[\u200b-\u200d\ufeff\u00a0]/g, '').replace(/\s+/g, ' ').trim();
}
function popKey(name) { return popNorm(name).replace(/\s+/g, '').toLowerCase(); }
function popAge(dob) {
  if (!dob) return null;
  const d = new Date(dob + 'T00:00:00');
  if (isNaN(d)) return null;
  const t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--;
  return a >= 0 ? a : null;
}
function popIsSchoolAge(age) { return age != null && age >= POP_SCHOOL_AGE[0] && age <= POP_SCHOOL_AGE[1]; }
function popNextId() {
  let max = 0;
  POP.records.forEach(r => { const m = String(r.pid || '').match(/^P(\d+)$/); if (m) max = Math.max(max, +m[1]); });
  return 'P' + (max + 1);
}
function popDate(v) {
  const s = popNorm(v);
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/\-.]([A-Za-z]{3,})[\/\-.](\d{4})$/);
  if (m) {
    const mon = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(m[2].slice(0, 3).toLowerCase());
    if (mon >= 0) return `${m[3]}-${String(mon + 1).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  }
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  const n = Number(s);
  if (n > 20000 && n < 60000) { const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000); return d.toISOString().slice(0, 10); }
  return '';
}
function popGender(v) {
  const s = popNorm(v).toLowerCase();
  if (/ស្រី|female|^f$|girl/.test(s)) return 'ស្រី';
  if (/ប្រុស|male|^m$|boy/.test(s)) return 'ប្រុស';
  return popNorm(v) === 'ស្រី' ? 'ស្រី' : (popNorm(v) === 'ប្រុស' ? 'ប្រុស' : '');
}

/* ---------- analysis ---------- */
function popAnalysis() {
  const byName = new Map();
  const studKeys = new Set();
  state.students.forEach(s => {
    const k = popKey([s.surname, s.name].filter(Boolean).join(' '));
    if (!k) return;
    studKeys.add(k);
    if (!byName.has(k)) byName.set(k, []);
    byName.get(k).push(s);
  });

  const rows = POP.records.map(r => {
    const k = popKey(r.name);
    const hits = byName.get(k) || [];
    let match = null, reason = 'none';
    if (hits.length) {
      const exact = hits.find(h => h.dob && r.dob && h.dob === r.dob);
      if (exact) { match = exact; reason = 'exact'; }
      else if (!r.dob) { match = hits[0]; reason = 'name'; }
      else { match = hits[0]; reason = 'dobdiff'; }
    }
    const age = popAge(r.dob);
    return { r, age, match, reason, schoolAge: popIsSchoolAge(age) };
  });

  const studMissing = state.students.filter(s => {
    const age = popAge(s.dob);
    if (!popIsSchoolAge(age)) return false;
    return !studKeys.has(popKey([s.surname, s.name].filter(Boolean).join(' ')));
  });

  const schoolAge = rows.filter(x => x.schoolAge);
  const matched = schoolAge.filter(x => x.match);
  const missing = schoolAge.filter(x => !x.match);
  return { rows, schoolAge, matched, missing, studMissing };
}

/* ---------- បន្ទះសមកាល Cloud នៅទំព័រប្រជាជន ---------- */
function popCloudPaint() {
  const el = $('#popCloudBar');
  if (!el || typeof cloudConnected !== 'function') return;
  const on = cloudConnected();
  const st = (typeof cloud !== 'undefined' && cloud.stats) || {};
  const busy = typeof cloud !== 'undefined' && cloud.busy;
  const status = (typeof cloud !== 'undefined' && cloud.status) || 'off';
  const last = (typeof cloud !== 'undefined' && cloud.last) ? cloudClock(cloud.last) : '';
  let email = '';
  try { email = cloudCfg().email || ''; } catch (e) { email = ''; }

  el.innerHTML = on
    ? `<div class="pop-cloud ${status}">
        <span class="dot"></span>
        <div class="pc-txt"><b>Cloud៖ ${esc(email || 'បានភ្ជាប់')}</b>
          <span>${last ? 'សមកាលចុងក្រោយ ' + last : 'មិនទាន់សមកាល'} · ប្រជាជនលើ Cloud ${st.remoteCit != null ? st.remoteCit : '—'} នាក់ · សិស្សលើ Cloud ${st.remoteStu != null ? st.remoteStu : '—'} នាក់</span></div>
        <div class="pc-act">
          <button class="btn sm" data-pc="pull"${busy ? ' disabled' : ''}>${icon('download')} ទាញពី Cloud</button>
          <button class="btn sm" data-pc="push"${busy ? ' disabled' : ''}>${icon('upload')} ផ្ទុកទៅ Cloud</button>
          <button class="btn sm primary" data-pc="sync"${busy ? ' disabled' : ''}>${icon('refresh')} សមកាលទាំងអស់</button>
        </div>
      </div>`
    : `<div class="pop-cloud off">
        <span class="dot"></span>
        <div class="pc-txt"><b>មិនទាន់ភ្ជាប់ Cloud</b><span>ភ្ជាប់គណនីដើម្បីទាញ និងរក្សាទុកទិន្នន័យប្រជាជនរួមគ្នា</span></div>
        <div class="pc-act"><button class="btn sm primary" data-pc="settings">${icon('cloud')} ភ្ជាប់ឥឡូវ</button></div>
      </div>`;

  el.querySelectorAll('[data-pc]').forEach(b => b.addEventListener('click', async () => {
    const k = b.dataset.pc;
    if (k === 'settings') { location.hash = '#/settings'; return; }
    if (k === 'pull') await cloudCitPull();
    else if (k === 'push') await cloudCitPush();
    else if (k === 'sync') await cloudSync({ manual: true });
    if (state.view === 'population') popCloudPaint();
  }));
}

function popHouseholds() {
  const set = new Set();
  POP.records.forEach(r => { if (r.household) set.add(r.household); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
}

function popFiltered(a) {
  const q = popUI.q.trim().toLowerCase();
  let rows = a.rows;
  if (popUI.tab === 'missing') rows = a.missing;
  if (popUI.hh) rows = rows.filter(x => x.r.household === popUI.hh);
  if (popUI.gender) rows = rows.filter(x => x.r.gender === popUI.gender);
  if (q) rows = rows.filter(x => [x.r.name, x.r.household, x.r.job, x.r.relation, x.r.school].join(' ').toLowerCase().includes(q));
  return rows.slice().sort((x, y) => String(x.r.household || '').localeCompare(String(y.r.household || ''), 'en', { numeric: true }) || String(x.r.name).localeCompare(String(y.r.name), 'km'));
}

  if (x.match && x.reason === 'exact') return `<span class="pill green">ក្នុងបញ្ជីសិស្ស</span>`;
  if (x.match && x.reason === 'dobdiff') return `<span class="pill amber">ឈ្មោះដូច · ខុសថ្ងៃកំណើត</span>`;

function wirePopTable() {
  const box = $('#popBody');
  if (!box || box.dataset.wired) return;
  box.dataset.wired = '1';
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-pact]');
    if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.pact === 'edit') popEdit(POP.records.find(r => r.pid === id));
    else if (b.dataset.pact === 'del') popDelete(id);
    else if (b.dataset.pact === 'student') {
      const a = popAnalysis().rows.find(x => x.r.pid === id);
      if (a && a.match) openStudent(a.match.id);
    } else if (b.dataset.pact === 'mkstudent') popToStudent(id);
    else if (b.dataset.pact === 'family') {
      const hh = b.dataset.hh;
      if (!hh) return;
      if (typeof cdOpenFamily === 'function') cdOpenFamily(hh);
      else toast('មិនអាចបើកកំណត់ត្រាគ្រួសារបានទេ', 'warn');
    }
  });
}

function popParseCSV(text) {
  const s = text.replace(/^\uFEFF/, '');
  const first = s.split(/\r?\n/)[0] || '';
  const delim = (first.split('\t').length - 1) >= (first.split(',').length - 1) ? '\t' : ',';
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => popNorm(x)));
}

  job: ['occupation', 'job', 'មុខរបរ'],
  household: ['householdid', 'household', 'familyid', 'គ្រួសារ', 'លេខគ្រួសារ'],
  school: ['school', 'សាលា', 'សាលារៀន']
};
function popHeadKey(h) { return popNorm(h).toLowerCase().replace(/[\s_\-]/g, ''); }
function popColIndex(headers) {
  const idx = {};
  headers.forEach((h, i) => {
    const k = popHeadKey(h);
    Object.keys(POP_HEADERS).forEach(f => {
      if (idx[f] == null && POP_HEADERS[f].some(a => popHeadKey(a) === k)) idx[f] = i;
    });
  });
  return idx;
}

function popImportText(text, fname) {
  let items = [];
  const t = text.trim();
  if (!t) { toast('ឯកសារទទេ', 'err'); return; }
  if (t[0] === '[' || t[0] === '{') {
    let o;
    try { o = JSON.parse(t); } catch (e) { toast('ឯកសារ JSON មិនត្រឹមត្រូវ', 'err'); return; }
    const arr = Array.isArray(o) ? o : (o.population || o.records || o.items || []);
    items = arr.map(x => ({
      name: popNorm(x.name || x.fullName || x.Name || [x.surname, x.name].filter(Boolean).join(' ')),
      gender: popGender(x.gender || x.Gender),
      dob: popDate(x.dob || x.DOB || x.birthDate),
      relation: popNorm(x.relation || x.relationship || x.Relationship),
      job: popNorm(x.job || x.occupation || x.Occupation),
      household: popNorm(x.household || x.householdId || x.HouseholdID),
      school: popNorm(x.school || x.School),
      note: popNorm(x.note || '')
    }));
  } else {
    const rows = popParseCSV(t);
    if (!rows.length) { toast('រកមិនឃើញទិន្នន័យក្នុងឯកសារ', 'err'); return; }
    const head = rows[0];
    const idx = popColIndex(head);
    const hasHeader = Object.keys(idx).length >= 2;
    const body = hasHeader ? rows.slice(1) : rows;
    items = body.map(r => {
      if (hasHeader) return {
        name: popNorm(idx.name != null ? r[idx.name] : ''),
        gender: popGender(idx.gender != null ? r[idx.gender] : ''),
        dob: popDate(idx.dob != null ? r[idx.dob] : ''),
        relation: popNorm(idx.relation != null ? r[idx.relation] : ''),
        job: popNorm(idx.job != null ? r[idx.job] : ''),
        household: popNorm(idx.household != null ? r[idx.household] : ''),
        school: popNorm(idx.school != null ? r[idx.school] : ''), note: ''
      };
      return { name: popNorm(r[0]), gender: popGender(r[1]), dob: popDate(r[2]), relation: popNorm(r[3]), job: popNorm(r[4]), household: popNorm(r[5]), school: popNorm(r[6]), note: '' };
    });
  }
  items = items.filter(x => popNorm(x.name));
  if (!items.length) { toast('រកមិនឃើញឈ្មោះក្នុងឯកសារនេះទេ', 'err'); return; }

  const seen = new Set(POP.records.map(r => popKey(r.name) + '|' + (r.dob || '') + '|' + (r.household || '')));
  const fresh = [], dupList = [];
  items.forEach(x => {
    const k = popKey(x.name) + '|' + (x.dob || '') + '|' + (x.household || '');
    if (seen.has(k)) { dupList.push(x); return; }
    seen.add(k); fresh.push(x);
  });

  const sampleNote = POP.sample ? '<div style="margin-top:8px;color:#9a6a10">ទិន្នន័យគំរូ ៣៥ នាក់ នឹងត្រូវជំនួសដោយទិន្នន័យថ្មីនេះ។</div>' : '';
  confirmBox({
    title: 'នាំចូលទិន្នន័យប្រជាជន', danger: false, ok: `បញ្ចូល ${fresh.length} នាក់`,
    msg: `<div style="font-size:13px;line-height:2">ឯកសារ <b>${esc(fname || '')}</b> មាន <b>${items.length}</b> នាក់។<br>
      ថ្មី <b style="color:#0b7a5d">${fresh.length}</b> · ស្ទួន <b>${dupList.length}</b>${sampleNote}</div>`
  }).then(ok => {
    if (!ok) return;
    if (POP.sample) { POP.records = []; POP.sample = false; }
    let n = 0;
    fresh.forEach(x => { POP.records.push(Object.assign({ pid: popNextId() }, x)); n++; });
    popSave(); renderPopulation();
    toast(`បាននាំចូល ${n} នាក់${dupList.length ? ` · រំលងស្ទួន ${dupList.length}` : ''}`, 'ok', 4200);
  });
}

/* ---------- v1.11: បែងចែកប្រជាជន ២ ក្រុមតាមអាយុ + នាំចេញ JSON ---------- */
const POP_SPLIT_AGE = 18;

function popAgeGroups() {
  const g = { g1: [], g2: [], unk: [] };
  POP.records.forEach(r => {
    const age = popAge(r.dob);
    const p = {
      pid: r.pid || '', name: r.name || '', gender: r.gender || '',
      dob: r.dob || '', age: age == null ? null : age,
      relation: r.relation || '', job: r.job || '',
      household: r.household || '', school: r.school || ''
    };
    if (age == null) g.unk.push(p);
    else if (age > POP_SPLIT_AGE) g.g1.push(p);
    else g.g2.push(p);
  });
  return g;
}

function popGenderCount(list) {
  const male = list.filter(x => x.gender === 'ប្រុស').length;
  const female = list.filter(x => x.gender === 'ស្រី').length;
  return { male, female, other: Math.max(0, list.length - male - female) };
}

function popGroupObject(id, label, cond, list) {
  const c = popGenderCount(list);
  const hh = new Set(list.map(x => x.household).filter(Boolean));
  return {
    id, label, condition: cond,
    count: list.length, male: c.male, female: c.female, other: c.other,
    households: hh.size,
    people: list
  };
}

function popGroupsJSON() {
  const g = popAgeGroups();
  const total = POP.records.length;
  return {
    app: 'kh-student-system',
    kind: 'population-age-groups',
    schema: 1,
    exportedAt: new Date().toISOString(),
    exportedDate: today(),
    school: {
      name: (state.settings && state.settings.school) || '',
      code: (state.settings && state.settings.code) || '',
      year: (state.settings && state.settings.year) || ''
    },
    rule: {
      splitAt: POP_SPLIT_AGE,
      group1: 'age > 18',
      group2: 'age <= 18',
      note: 'អាយុគណនាពីថ្ងៃខែឆ្នាំកំណើត គិតត្រឹមថ្ងៃនាំចេញ'
    },
    summary: {
      total,
      group1: g.g1.length,
      group2: g.g2.length,
      unknownDob: g.unk.length,
      households: new Set(POP.records.map(r => r.household).filter(Boolean)).size
    },
    groups: [
      popGroupObject('group1', 'ក្រុមទី១ — អាយុលើស ១៨ ឆ្នាំ', 'age > 18', g.g1),
      popGroupObject('group2', 'ក្រុមទី២ — អាយុ ១៨ ឆ្នាំ ឬក្រោម', 'age <= 18', g.g2)
    ],
    unknownDob: g.unk
  };
}

function popPaintAgeSplit() {
  const el = $('#popAgeSplit');
  if (!el) return;
  const g = popAgeGroups();
  const total = g.g1.length + g.g2.length + g.unk.length;
  const p1 = total ? g.g1.length / total * 100 : 0;
  const p2 = total ? g.g2.length / total * 100 : 0;
  const pu = Math.max(0, 100 - p1 - p2);
  el.innerHTML = `
    <div class="as-title"><b>ចែកតាមអាយុ</b><span class="cell-sub">គិតត្រឹម ${fmtDate(today())}</span></div>
    <div class="as-bar" role="img" aria-label="សមាមាត្រពីរក្រុម">
      <i class="g1" style="width:${p1}%"></i><i class="g2" style="width:${p2}%"></i><i class="gu" style="width:${pu}%"></i>
    </div>
    <div class="as-leg">
      <span><i class="dot g1"></i>ក្រុម ១ · អាយុលើស ១៨ <b>${g.g1.length}</b></span>
      <span><i class="dot g2"></i>ក្រុម ២ · អាយុ ១៨ ឬក្រោម <b>${g.g2.length}</b></span>
      ${g.unk.length ? `<span><i class="dot gu"></i>គ្មានថ្ងៃកំណើត <b>${g.unk.length}</b></span>` : ''}
    </div>
    <button class="btn sm primary" id="popJsonBtn" style="margin-left:auto">${icon('download')} នាំចេញ JSON</button>`;
  const b = $('#popJsonBtn');
  if (b) b.addEventListener('click', popExportJSONGroups);
}

function popExportJSONGroups() {
  if (!POP.records.length) { toast('គ្មានទិន្នន័យសម្រាប់នាំចេញ', 'warn'); return; }
  const data = popGroupsJSON();
  const g1 = data.groups[0], g2 = data.groups[1];
  const tile = (g, cls) => `<div>
      <div class="t"><i class="dot ${cls}"></i>${esc(g.label)}</div>
      <div class="n">${g.count}<small>នាក់</small></div>
      <div class="f">ប្រុស ${g.male} · ស្រី ${g.female}${g.households ? ' · ' + g.households + ' គ្រួសារ' : ''}</div>
      <div class="f" style="opacity:.75">លក្ខខណ្ឌ៖ ${esc(g.condition)}</div>
    </div>`;

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="max-width:640px">
    <div class="modal-head"><div><h3>នាំចេញ JSON — បែងចែក ២ ក្រុមតាមអាយុ</h3><p>ប្រជាជនសរុប ${data.summary.total} នាក់ · គិតត្រឹម ${fmtDate(today())}</p></div><button class="btn icon" data-close>${icon('x')}</button></div>
    <div class="modal-body">
      <div class="pop-grp">${tile(g1, 'g1')}${tile(g2, 'g2')}</div>
      ${data.summary.unknownDob ? `<div class="notice warn" style="margin-bottom:10px">${icon('alert')}<div>មាន <b>${data.summary.unknownDob} នាក់</b> គ្មានថ្ងៃខែឆ្នាំកំណើត ដូច្នេះមិនអាចដាក់ក្នុងក្រុមណាមួយបានទេ — ពួកគេនឹងដាក់ក្នុងផ្នែក <b>unknownDob</b> ដោយឡែក។ សូមបំពេញថ្ងៃកំណើត ដើម្បីឲ្យការបែងចែកពេញលេញ។</div></div>` : ''}
      <div class="notice" style="margin-bottom:0">${icon('info')}<div>ឯកសារមាន <b>groups</b> ២ (ឈ្មោះ ភេទ ថ្ងៃកំណើត អាយុ ត្រូវជា មុខរបរ គ្រួសារ) ព្រមទាំង <b>summary</b> ចំនួនសរុប។ អាចបើកបានដោយ Excel, Google Sheets ឬប្រព័ន្ធផ្សេង។</div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>បោះបង់</button>
      <div class="right"><button class="btn" data-two>${icon('download')} ២ ឯកសារដាច់ដោយឡែក</button><button class="btn primary" data-one>${icon('download')} ឯកសារតែមួយ</button></div></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  ov.addEventListener('click', e => { if (e.target === ov) close(); });

  const code = ((state.settings && state.settings.code) || 'SIS').replace(/[^A-Za-z0-9_-]/g, '');
  const stamp = today();
  const jsonBlob = obj => new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });

  $('[data-one]', ov).addEventListener('click', () => {
    download(jsonBlob(data), `population-agegroups-${code}-${stamp}.json`);
    close();
    toast(`បាននាំចេញ JSON · ក្រុម១ ${g1.count} នាក់ · ក្រុម២ ${g2.count} នាក់`, 'ok', 4200);
  });

  $('[data-two]', ov).addEventListener('click', () => {
    const base = { app: data.app, kind: data.kind, schema: data.schema, exportedAt: data.exportedAt, exportedDate: data.exportedDate, school: data.school, rule: data.rule };
    download(jsonBlob(Object.assign({}, base, { group: g1 })), `population-group1-over18-${code}-${stamp}.json`);
    setTimeout(() => {
      download(jsonBlob(Object.assign({}, base, { group: g2 })), `population-group2-18under-${code}-${stamp}.json`);
      close();
      toast('បាននាំចេញ ២ ឯកសារ', 'ok', 4200);
    }, 400);
  });
}

/* ---------- export ---------- */
function popExportCSV() {
  if (!POP.records.length) { toast('គ្មានទិន្នន័យសម្រាប់នាំចេញ', 'warn'); return; }
  const a = popAnalysis();
  let rows;
  if (popUI.tab === 'studmiss') {
    rows = a.studMissing.map(s => [fullName(s), s.id, s.grade || '', s.dob || '', popAge(s.dob) ?? '', 'អត់មានក្នុងប្រជាជន', s.phone || '']);
  } else {
    rows = popFiltered(a).map(x => [x.r.name, x.r.gender, x.r.dob, x.age ?? '', x.r.relation, x.r.job, x.r.household, x.r.school,
      x.match ? (x.reason === 'dobdiff' ? 'មានក្នុងបញ្ជី (ខុសថ្ងៃកំណើត)' : 'មានក្នុងបញ្ជីសិស្ស') : (x.schoolAge ? 'អត់មានក្នុងបញ្ជីសិស្ស' : 'មិនពាក់ព័ន្ធ'),
      x.match ? x.match.id : '']);
  }
  const head = popUI.tab === 'studmiss' ? ['ឈ្មោះសិស្ស', 'លេខសិស្ស', 'ថ្នាក់', 'ថ្ងៃកំណើត', 'អាយុ', 'ស្ថានភាព', 'ទូរស័ព្ទ']
    : ['ឈ្មោះ', 'ភេទ', 'ថ្ងៃកំណើត', 'អាយុ', 'ត្រូវជា', 'មុខរបរ', 'គ្រួសារ', 'សាលា', 'ស្ថានភាព', 'លេខសិស្ស'];
  const csv = [head].concat(rows).map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }), `population-compare-${today()}.csv`);
  toast('បាននាំចេញ CSV', 'ok');
}

/* ---------- merge from backup ---------- */
function popMergeRecords(list) {
  if (!Array.isArray(list) || !list.length) return { added: 0, dup: 0 };
  const seen = new Set(POP.records.map(r => popKey(r.name) + '|' + (r.dob || '') + '|' + (r.household || '')));
  let added = 0;
  list.forEach(x => {
    const name = popNorm(x.name || [x.surname, x.name].filter(Boolean).join(' '));
    if (!name) return;
    const rec = {
      pid: popNextId(), name, gender: popGender(x.gender), dob: popDate(x.dob),
      relation: popNorm(x.relation), job: popNorm(x.job), household: popNorm(x.household),
      school: popNorm(x.school), note: popNorm(x.note)
    };
    const k = popKey(rec.name) + '|' + (rec.dob || '') + '|' + (rec.household || '');
    if (seen.has(k)) return;
    seen.add(k); POP.records.push(rec); added++;
  });
  if (added) { POP.sample = false; popSave(); }
  return { added, dup: list.length - added };
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  popLoad();
  const fi = document.createElement('input');
  fi.type = 'file'; fi.id = 'popFile'; fi.accept = '.csv,.txt,.tsv,.json';
  fi.style.display = 'none';
  fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0];
    if (f) popImportFile(f);
    fi.value = '';
  });
  document.body.appendChild(fi);
});

<script>
/* =========================================================
   កាតថ្នាក់ · កាតសិស្ស · កាតគ្រួសារ  (Cards view)
   ========================================================= */
const CD = { tab: 'class', layout: 'grid', q: '', grade: '', gender: '', sortKey: '', sortDir: 1, page: 1 };
window.CD = CD;

const CD_HEAD_PRIORITY = ['ឪពុក', 'ប្ដី', 'ម្ដាយ', 'ម្តាយ', 'មេគ្រួសារ', 'ម្ចាស់ផ្ទះ'];
const CD_PALETTE = [
  ['#6d5bd0', '#4a3aa6'], ['#2f8fd0', '#1b6aa8'], ['#0f9d76', '#0a7a5b'], ['#d99a26', '#b07613'],
  ['#d9663f', '#a84624'], ['#b03a6d', '#8a2a54'], ['#0d4a63', '#07303f'], ['#3b7a9e', '#265a78'],
  ['#6b8f3a', '#4d6b24'], ['#a05a2c', '#7b411c'], ['#4a5fa8', '#33437f'], ['#2d7d7d', '#1d5c5c']
];

/* ---------- helpers ---------- */
function cdAge(dob) {
  if (!dob) return '';
  const p = String(dob).split('-');
  if (p.length !== 3) return '';
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d.getTime())) return '';
  const t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a >= 0 && a < 120 ? a : '';
}
function cdVillage(s) { return (s && (s.cuVillage || s.bpVillage)) || ''; }
function cdVillagesOf(list) {
  const set = new Set();
  list.forEach(s => { const v = cdVillage(s); if (v) set.add(v.trim()); });
  return Array.from(set);
}
function cdInitial(s) {
  const c = String(s.surname || s.name || '?').trim().charAt(0);
  return c || '?';
}
function cdName(s) { return [s.surname, s.name].filter(Boolean).join(' ') || '(គ្មានឈ្មោះ)'; }
function cdShort(v, n) { return String(v == null ? '' : v); }
function cdCmp(a, b) {
  const sa = String(a == null ? '' : a), sb = String(b == null ? '' : b);
  try { return sa.localeCompare(sb, 'km'); } catch (e) { return sa < sb ? -1 : sa > sb ? 1 : 0; }
}
function cdStudentByName(name) {
  const k = popKey(name);
  if (!k) return null;
  return state.students.find(s => popKey([s.surname, s.name].filter(Boolean).join(' ')) === k) || null;
}
function cdPopOfStudent(s) {
  const k = popKey([s.surname, s.name].filter(Boolean).join(' '));
  if (!k) return null;
  return POP.records.find(r => popKey(r.name) === k) || null;
}
function cdGradeList() {
  return GRADES.map(g => {
    const list = state.students.filter(s => s.grade === g);
    const female = list.filter(s => s.gender === 'ស្រី').length;
    const ages = list.map(s => cdAge(s.dob)).filter(a => a !== '');
    const avg = ages.length ? Math.round(ages.reduce((x, y) => x + y, 0) / ages.length) : '';
    const vills = cdVillagesOf(list);
    return { g, list, total: list.length, female, male: list.length - female, avg, vills, villages: vills.length };
  }).filter(x => x.total > 0);
}
function cdHouseholds() {
  const map = new Map();
  POP.records.forEach(r => {
    const id = (r.household || '').trim();
    if (!id) return;
    if (!map.has(id)) map.set(id, []);
    map.get(id).push(r);
  });
  const out = [];
  map.forEach((recs, id) => {
    const head = recs.find(r => r.head) || recs.find(r => CD_HEAD_PRIORITY.includes((r.relation || '').trim())) || recs[0];
    const ordered = [head].concat(recs.filter(r => r !== head).sort((a, b) => {
      const ai = CD_HEAD_PRIORITY.indexOf((a.relation || '').trim());
      const bi = CD_HEAD_PRIORITY.indexOf((b.relation || '').trim());
      if (ai !== bi) return (ai < 0 ? 90 : ai) - (bi < 0 ? 90 : bi);
      return (cdAge(b.dob) || 0) - (cdAge(a.dob) || 0);
    }));
    const matched = ordered.map(r => ({ r, s: cdStudentByName(r.name) }));
    const village = (matched.find(x => x.s && cdVillage(x.s)) || {}).s ? cdVillage(matched.find(x => x.s && cdVillage(x.s)).s) : '';
    const schoolAge = recs.filter(r => { const a = cdAge(r.dob); return a !== '' && a >= 3 && a <= 17; }).length;
    out.push({ id, recs: ordered, head, village, schoolAge, matched });
  });
  return out.sort((a, b) => cdCmp(a.id, b.id));
}

/* ---------- data per tab ---------- */
function cdRows() {
  const q = CD.q.trim().toLowerCase();
  if (CD.tab === 'class') {
    let rows = cdGradeList();
    if (q) rows = rows.filter(x => x.g.toLowerCase().includes(q) || x.vills.join(' ').toLowerCase().includes(q));
    return cdSortRows(rows, x => ({
      name: x.g, total: x.total, female: x.female, age: x.avg === '' ? null : x.avg, village: x.vills[0] || '', grade: GRADES.indexOf(x.g)
    }), 'grade');
  }
  if (CD.tab === 'family') {
    let rows = cdHouseholds();
    if (q) rows = rows.filter(x => x.id.toLowerCase().includes(q) || String(x.head.name || '').toLowerCase().includes(q) || x.village.toLowerCase().includes(q) || x.recs.some(r => String(r.name || '').toLowerCase().includes(q)));
    return cdSortRows(rows, x => ({
      name: x.head.name || '', household: x.id, gender: x.head.gender || '', age: cdAge(x.head.dob) === '' ? null : cdAge(x.head.dob), members: x.recs.length, village: x.village || ''
    }), 'household');
  }
  let rows = state.students.slice();
  if (CD.grade) rows = rows.filter(s => s.grade === CD.grade);
  if (CD.gender) rows = rows.filter(s => s.gender === CD.gender);
  if (q) rows = rows.filter(s => [s.id, s.surname, s.name, s.phone, s.fPhone, s.mPhone, s.gPhone, s.grade, cdVillage(s)].join(' ').toLowerCase().includes(q));
  return cdSortRows(rows, s => ({
    name: cdName(s), gender: s.gender || '', age: cdAge(s.dob) === '' ? null : cdAge(s.dob), village: cdVillage(s), grade: GRADES.indexOf(s.grade)
  }), 'name');
}
function cdSortRows(rows, map, defKey) {
  const key = CD.sortKey || defKey;
  const dir = CD.sortKey ? CD.sortDir : (defKey === 'household' ? 1 : 1);
  return rows.slice().sort((a, b) => {
    const va = map(a)[key], vb = map(b)[key];
    if (typeof va === 'number' || typeof vb === 'number') {
      const na = (va === '' || va == null) ? null : va;
      const nb = (vb === '' || vb == null) ? null : vb;
      if (na === null && nb === null) return 0;
      if (na === null) return 1;
      if (nb === null) return -1;
      return (na - nb) * dir;
    }
    const sa = String(va == null ? '' : va), sb = String(vb == null ? '' : vb);
    if (!sa && !sb) return 0;
    if (!sa) return 1;
    if (!sb) return -1;
    if (key === 'household') {
      const na = parseInt(sa.replace(/\D+/g, ''), 10), nb = parseInt(sb.replace(/\D+/g, ''), 10);
      if (isFinite(na) && isFinite(nb) && na !== nb) return (na - nb) * dir;
    }
    return cdCmp(sa, sb) * dir;
  });
}
function cdPageSize() { return CD.layout === 'grid' ? 24 : 15; }
function cdPageRows(rows) {
  const size = cdPageSize();
  const pages = Math.max(1, Math.ceil(rows.length / size));
  if (CD.page > pages) CD.page = pages;
  return { pages, items: rows.slice((CD.page - 1) * size, CD.page * size) };
}

/* ---------- paint ---------- */
function cdPaint() {
  const body = $('#cdBody'); if (!body) return;
  const rows = cdRows();
  const { pages, items } = cdPageRows(rows);
  const sortSel = $('#cdSort');
  if (sortSel) sortSel.innerHTML = cdSortOptions();

  if (!rows.length) {
    body.innerHTML = `<div class="empty"><div class="art">${icon(CD.tab === 'class' ? 'school' : CD.tab === 'family' ? 'heart' : 'users')}</div>
      <h4>មិនមានទិន្នន័យត្រូវនឹងលក្ខខណ្ឌ</h4>
      <p>${CD.tab === 'family' && !POP.records.length ? 'សូមនាំចូលទិន្នន័យប្រជាជនជាមុនសិន' : 'សូមសាកល្បងស្វែងរកដោយពាក្យផ្សេង ឬសម្អាតតម្រង'}</p>
      ${CD.tab === 'family' ? `<button class="btn" data-nav="population">${icon('upload')} ទៅកាន់ទិន្នន័យប្រជាជន</button>` : `<button class="btn" data-nav="form">${icon('plus')} ចុះឈ្មោះសិស្ស</button>`}</div>`;
    return;
  }

  let html = '';
  if (CD.layout === 'grid') {
    html += '<div class="cd-grid">' + items.map(x => CD.tab === 'class' ? cdClassCard(x) : CD.tab === 'family' ? cdFamilyCard(x) : cdStudentCard(x)).join('') + '</div>';
  } else if (CD.tab === 'class') {
    html += cdClassTable(items);
  } else if (CD.tab === 'family') {
    html += cdFamilyTable(items);
  } else {
    html += cdStudentTable(items);
  }
  html += cdPager(rows.length, pages);
  body.innerHTML = html;

  body.querySelectorAll('[data-card]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[data-noopen]')) return;
      const id = el.dataset.id;
      if (el.dataset.card === 'class') cdOpenClass(id);
      else if (el.dataset.card === 'family') cdOpenFamily(id);
      else cdOpenStudent(id);
    });
  });
  body.querySelectorAll('[data-ct]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const g = b.dataset.id;
    if (b.dataset.ct === 'stud') cdOpenClass(g);
    else if (b.dataset.ct === 'teacher') cdEditTeacher(g);
    else if (b.dataset.ct === 'print') cdPrintClass(g);
  }));
  body.querySelectorAll('[data-sortk]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sortk;
      if (CD.sortKey === k) CD.sortDir = -CD.sortDir; else { CD.sortKey = k; CD.sortDir = 1; }
      CD.page = 1; cdPaint();
    });
  });
  body.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => {
    CD.page = +b.dataset.pg; cdPaint();
    const c = $('.cd-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  const sel = $('#cdSort');
  if (sel) sel.value = CD.sortKey ? CD.sortKey + ':' + (CD.sortDir === -1 ? 'desc' : 'asc') : sel.options[0] ? sel.options[0].value : '';
}

  if (CD.tab === 'class') return `<option value="">តម្រៀប៖ តាមថ្នាក់</option><option value="name:asc">ឈ្មោះថ្នាក់ ក→ហ</option><option value="total:desc">សិស្សច្រើន→តិច</option><option value="total:asc">សិស្សតិច→ច្រើន</option><option value="female:desc">ស្រីច្រើន→តិច</option><option value="age:asc">អាយុមធ្យមតូច→ធំ</option>`;

function cdBadges(s, max) {
  const b = [];

/* ---------- pager ---------- */
function cdPager(total, pages) {
  if (pages <= 1) return `<div class="cd-pagebar"><span>សរុប <b>${total}</b> កំណត់ត្រា</span></div>`;
  const p = CD.page;
  const nums = [];
  const from = Math.max(1, Math.min(p - 2, pages - 4));
  const to = Math.min(pages, from + 4);
  for (let i = from; i <= to; i++) nums.push(`<button type="button" data-pg="${i}" class="${i === p ? 'on' : ''}">${i}</button>`);
  return `<div class="cd-pagebar">
    <span>សរុប <b>${total}</b> · ទំព័រ <b>${p}</b>/${pages}</span>
    <div class="pages">
      <button type="button" data-pg="${p - 1}" ${p === 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      ${nums.join('')}
      <button type="button" data-pg="${p + 1}" ${p === pages ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>
  </div>`;
}

/* ---------- modal helpers ---------- */
function cdOverlay(html, maxw) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal cd-modal" style="max-width:${maxw || 920}px">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => {
    if (e.key !== 'Escape') return;
    const all = document.querySelectorAll('.overlay');
    if (all[all.length - 1] !== ov) return;
    close();
  };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  return { ov, close };
}

    </tr>`;
  }).join('');
  const html = `<div class="cdm-head gold-h">
      <div class="cdm-headtop"><span class="cdm-kicker">កាតគ្រួសារ</span><button class="btn icon ghost" data-close>${icon('x')}</button></div>
      <h3>គ្រួសារ ${esc(x.id)}</h3>
      <p>${x.village ? esc(x.village) + ' · ' : ''}${x.recs.length} នាក់ · អាយុចូលរៀន ${x.schoolAge} នាក់</p>
    </div>
    <div class="cdm-body">
      <div class="cd-headcard">
        <span class="kav xl gold">${esc(String(head.name || '?').charAt(0))}</span>
        <div class="cd-headcard-t"><span class="cd-headcard-k">មេគ្រួសារ</span><h4>${esc(head.name || '—')}</h4><p>${esc(head.gender || '')}${headAge !== '' ? ' · អាយុ ' + headAge : ''}${head.job ? ' · ' + esc(head.job) : ''}${head.dob ? ' · កើត ' + fmtDate(head.dob) : ''}</p></div>
        <div class="cd-headcard-s"><b>${x.recs.length}</b><span>សមាជិក</span></div>
      </div>
      <div class="cdm-section-t">សមាជិកក្នុងគ្រួសារ <span>ចុចលើសមាជិកដែលជាសិស្ស ដើម្បីមើលកាតសិស្ស</span></div>
      <div class="table-wrap"><table class="cd-table"><thead><tr>
        <th style="width:46px">ល.រ</th><th>ឈ្មោះ</th><th style="width:110px">ត្រូវជា</th><th style="width:80px">ភេទ</th><th style="width:76px">អាយុ</th><th style="width:130px">មុខរបរ</th><th style="width:140px">ទំនាក់ទំនងសាលា</th><th style="width:130px"></th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-print>${icon('printer')} បោះពុម្ពបញ្ជីគ្រួសារ</button>
      <div class="right"><button class="btn" data-close>បិទ</button></div>
    </div>`;
  const { ov } = cdOverlay(html, 960);
  ov.querySelectorAll('tr[data-sid]').forEach(tr => {
    if (!tr.dataset.sid) return;
    tr.addEventListener('click', e => { if (e.target.closest('[data-noopen]')) return; cdOpenStudent(tr.dataset.sid); });
  });
  ov.querySelectorAll('[data-sethead]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const pid = b.dataset.sethead;
    POP.records.forEach(r => { if (r.household === x.id) r.head = (r.pid === pid); });
    popSave(); toast('បានកំណត់មេគ្រួសារ', 'ok');
    ov.remove(); cdOpenFamily(x.id);
  }));
  ov.querySelector('[data-print]').addEventListener('click', () => cdPrintFamily(x.id));
}

/* ---------- print ---------- */
function cdPrintHead(title, sub) {

    <div class="school">${esc(st.school || 'សាលារៀន')}${st.district ? ' — ' + esc(st.district) : ''}${st.province ? ', ' + esc(st.province) : ''}</div>

function cdPrintClass(grade) {

  printHTML(cdPrintHead('បញ្ជីឈ្មោះសិស្សក្នុងថ្នាក់', `${grade} · សិស្សសរុប ${x.total} នាក់ · ស្រី ${x.female} · ប្រុស ${x.male} · ឆ្នាំសិក្សា ${state.settings.year}`) +
    `<table border="1" style="border-collapse:collapse;width:100%;font-size:11px"><thead><tr><th>ល.រ</th><th>ឈ្មោះសិស្ស</th><th>ភេទ</th><th>អាយុ</th><th>ថ្ងៃកំណើត</th><th>ភូមិ</th><th>ទូរស័ព្ទ</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div style="margin-top:26px;display:flex;justify-content:space-between;font-size:11px"><div>ធ្វើនៅ ............ ថ្ងៃទី ............</div><div style="text-align:center">គ្រូបន្ទុកថ្នាក់<br><br><br>................................</div></div></div>`);
}
function cdPrintFamily(hh) {
  const x = cdHouseholds().find(f => f.id === hh);
  if (!x) return;
  const rows = x.matched.map((m, i) => `<tr><td style="text-align:center">${i + 1}</td><td>${esc(m.r.name)}</td><td>${esc(m.r.relation || '')}</td><td>${esc(m.r.gender || '')}</td><td style="text-align:center">${cdAge(m.r.dob)}</td><td>${esc(m.r.job || '')}</td><td>${m.s ? 'សិស្ស ' + esc(m.s.grade || '') : ''}</td></tr>`).join('');
  printHTML(cdPrintHead('បញ្ជីសមាជិកគ្រួសារ', `គ្រួសារ ${x.id}${x.village ? ' · ' + x.village : ''} · មេគ្រួសារ ${x.head.name || ''} · ${x.recs.length} នាក់`) +
    `<table border="1" style="border-collapse:collapse;width:100%;font-size:11px"><thead><tr><th>ល.រ</th><th>ឈ្មោះ</th><th>ត្រូវជា</th><th>ភេទ</th><th>អាយុ</th><th>មុខរបរ</th><th>សិស្ស</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

/* ---------- export ---------- */
function cdExport() {
  const rows = cdRows();
  if (!rows.length) { toast('មិនមានទិន្នន័យសម្រាប់នាំចេញ', 'warn'); return; }
  let head, body, name;
  if (CD.tab === 'class') {
    head = ['ថ្នាក់', 'សិស្សសរុប', 'ស្រី', 'ប្រុស', 'អាយុមធ្យម', 'ចំនួនភូមិ', 'ភូមិ'];
    body = rows.map(x => [x.g, x.total, x.female, x.male, x.avg, x.villages, x.vills.join(', ')]);
    name = 'class-cards';
  } else if (CD.tab === 'family') {
    head = ['គ្រួសារ', 'មេគ្រួសារ', 'ភេទ', 'អាយុ', 'សមាជិក', 'អាយុចូលរៀន', 'ភូមិ', 'សមាជិកទាំងអស់'];
    body = rows.map(x => [x.id, x.head.name, x.head.gender, cdAge(x.head.dob), x.recs.length, x.schoolAge, x.village, x.recs.map(r => r.name).join('; ')]);
    name = 'family-cards';
  } else {
    head = ['លេខសិស្ស', 'គោត្តនាម', 'នាម', 'ភេទ', 'ថ្ងៃកំណើត', 'អាយុ', 'ថ្នាក់', 'ភូមិ', 'ឃុំ/សង្កាត់', 'ស្រុក/ខណ្ឌ', 'ខេត្ត/ក្រុង', 'ទូរស័ព្ទ'];
    body = rows.map(s => [s.id, s.surname, s.name, s.gender, fmtDate(s.dob), cdAge(s.dob), s.grade, cdVillage(s), communeName(s.cuDistrict, s.cuCommune), districtName(s.cuProvince, s.cuDistrict), provinceName(s.cuProvince), s.phone]);
    name = 'student-cards';
  }
  const csv = [head].concat(body).map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }), `${name}-${today()}.csv`);
  toast('បាននាំចេញ CSV', 'ok');
}

/* =========================================================
   ផ្ទាំងគ្រប់គ្រង — សិស្សធៀបនឹងប្រជាជន (តាមវ័យ)
   ========================================================= */
function cdMonths(dob) {
  if (!dob) return null;
  const p = String(dob).split('-');
  if (p.length !== 3) return null;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d.getTime())) return null;
  const t = new Date();
  let m = (t.getFullYear() - d.getFullYear()) * 12 + (t.getMonth() - d.getMonth());
  if (t.getDate() < d.getDate()) m--;
  return m >= 0 ? m : null;
}

function dashCompareHTML() {
  const S = state.students || [];
  const P = (typeof POP !== 'undefined' && Array.isArray(POP.records)) ? POP.records : [];
  const kg = S.filter(s => s.grade === 'មត្តេយ្យ').length;
  const g1 = S.filter(s => s.grade === 'ថ្នាក់ទី១').length;
  const all = S.length;

  const inList = r => !!cdStudentByName(r.name);
  const group = fn => {
    const l = P.filter(fn);
    return { n: l.length, matched: l.filter(inList).length };
  };
  const p35 = group(r => { const a = popAge(r.dob); return a !== null && a >= 3 && a <= 5; });
  const p6 = group(r => { const m = cdMonths(r.dob); return m !== null && m >= 70 && m < 84; });
  const p311 = group(r => { const a = popAge(r.dob); return a !== null && a >= 3 && a <= 11; });

  const tile = (opt) => {
    const { title, age, iconName, students, pop, tone, tint, grade } = opt;
    const rate = pop.n >= 10 ? Math.round(students / pop.n * 100) : null;
    const w = rate === null ? 0 : Math.max(3, Math.min(100, rate));
    let status, cls;
    if (!pop.n) { status = 'មិនទាន់មានទិន្នន័យប្រជាជន'; cls = 'muted'; }
    else if (rate === null) { status = 'ប្រជាជនតិច — មិនគណនាអត្រា'; cls = 'muted'; }
    else if (rate > 100) { status = 'លើស ' + (students - pop.n) + ' នាក់'; cls = 'warn'; }
    else if (rate >= 95) { status = 'គ្របដណ្តប់ពេញលេញ'; cls = 'ok'; }
    else { status = 'ខ្វះ ' + (pop.n - students) + ' នាក់'; cls = 'warn'; }
    return `<div class="cmp-tile" data-cmp-grade="${esc(grade)}" role="button" tabindex="0" style="--tone:${tone};--tint:${tint}" title="ចុចដើម្បីមើលបញ្ជីសិស្ស">
      <div class="cmp-h">
        <span class="cmp-ico">${icon(iconName)}</span>
        <span class="cmp-t">${esc(title)}</span>
        <span class="cmp-age">${esc(age)}</span>
      </div>
      <div class="cmp-nums">
        <div class="cmp-n"><b>${students}</b><span>សិស្ស</span></div>
        <span class="cmp-slash">/</span>
        <div class="cmp-p"><b>${pop.n}</b><span>ប្រជាជន</span></div>
        <div class="cmp-rate"><b>${rate === null ? '—' : rate + '%'}</b><span>អត្រា</span></div>
      </div>
      <div class="cmp-track"><i style="width:${w}%"></i></div>
      <div class="cmp-foot">
        <span>ក្នុងបញ្ជីសិស្ស <b>${pop.matched}/${pop.n}</b></span>
        <span class="cmp-st ${cls}">${status}</span>
      </div>
    </div>`;
  };

  return `<div class="card dash-cmp mb-18">
    <div class="card-head">
      <div><h3>សិស្សធៀបនឹងប្រជាជន</h3>
        <div class="sub">គណនាតាមវ័យ — សិស្សដែលបានចុះឈ្មោះ ធៀបនឹងប្រជាជនក្នុងភូមិ</div></div>
      <span class="spacer"></span>
      <span class="pill ${P.length ? (POP.sample ? 'amber' : 'green') : 'gray'}">ប្រជាជន ${P.length} នាក់</span>
      <button class="btn sm" data-nav="population">${icon('chart')} វិភាគលម្អិត</button>
    </div>
    <div class="card-body">
      <div class="cmp-grid">
        ${tile({ title: 'មត្តេយ្យ', age: '៣–៥ ឆ្នាំ', iconName: 'school', students: kg, pop: p35, tone: '#6d5bd0', tint: '#efebfd', grade: 'មត្តេយ្យ' })}
        ${tile({ title: 'ថ្នាក់ទី១', age: '៦ ឆ្នាំ / ៧០ ខែ', iconName: 'graduation', students: g1, pop: p6, tone: '#2f8fd0', tint: '#e8f3fb', grade: 'ថ្នាក់ទី១' })}
        ${tile({ title: 'សិស្សទាំងអស់', age: 'ប្រជាជន ៣–១១ ឆ្នាំ', iconName: 'users', students: all, pop: p311, tone: '#0f9d76', tint: '#e6f7f1', grade: '' })}
      </div>
      <div class="cmp-legend">អត្រា = ចំនួនសិស្ស ÷ ចំនួនប្រជាជនក្នុងវ័យតែមួយ · គណនាតែពេលប្រជាជនយ៉ាងតិច ១០ នាក់</div>
      ${POP.sample ? `<div class="cmp-note">${icon('alert')}<div>ទិន្នន័យប្រជាជនបច្ចុប្បន្នជា<b>គំរូ ${P.length} នាក់</b> — អត្រាគ្របដណ្តប់នឹងបង្ហាញត្រឹមត្រូវ ពេលនាំចូលទិន្នន័យប្រជាជនពិត (ត្រូវការយ៉ាងតិច ១០ នាក់ក្នុងក្រុមវ័យ)។ <button class="btn sm ghost" data-nav="population">នាំចូលឥឡូវ</button></div></div>` : ''}
      ${!P.length ? `<div class="cmp-note info">${icon('info')}<div>មិនទាន់មានទិន្នន័យប្រជាជន — សូមនាំចូលនៅផ្ទាំង «ទិន្នន័យប្រជាជន» ដើម្បីធៀបស្ថិតិ។</div></div>` : ''}
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cmp-grade]');
  if (!t) return;

<script>
/* ---------------- shell ---------------- */
function setTop(title, sub, actions) {
  $('#pageTitle').textContent = title;
  $('#pageSub').textContent = sub || '';
  $('#topActions').innerHTML = actions || '';
}
function updateNav() {
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const n = $('#navCount'); if (n) n.textContent = state.students.length;
  const pn = $('#popCount'); if (pn && typeof POP !== 'undefined') pn.textContent = POP.records.length;
  const sn = $('#sideSchool'), sd = $('#sideDist');
  if (sn) sn.textContent = state.settings.school || 'សូមកំណត់ឈ្មោះសាលា';
  if (sd) sd.textContent = [state.settings.district, state.settings.province].filter(Boolean).join(', ') || 'ឆ្នាំសិក្សា ' + state.settings.year;
}
function updateSideBadge() { const n = $('#navCount'); if (n) n.textContent = state.students.length; updateNav(); }

/* ---------------- list ---------------- */
function filtered() {
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  return state.students.filter(s => {
    if (f.grade && s.grade !== f.grade) return false;
    if (f.gender && s.gender !== f.gender) return false;
    if (f.flag === 'poor' && !isYes(s.poorFamily)) return false;
    if (f.flag === 'equity' && !isYes(s.equityCard)) return false;
    if (f.flag === 'disabled' && (!s.disabilityType || s.disabilityType === 'គ្មាន')) return false;
    if (f.flag === 'ethnic' && (!s.ethnic || s.ethnic === 'ខ្មែរ')) return false;
    if (f.flag === 'reading' && s.readingPack !== 'បានទទួល') return false;
    if (f.flag === 'math' && s.mathPack !== 'បានទទួល') return false;
    if (q) {
      const hay = [s.id, s.surname, s.name, s.phone, s.fPhone, s.mPhone, s.gPhone, s.gName, s.fName, s.mName, s.grade].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function renderList() {
  setTop('បញ្ជីសិស្ស', 'ស្វែងរក ត្រង និងគ្រប់គ្រងព័ត៌មានសិស្សទាំងអស់',
    `<button class="btn" id="btnExportList">${icon('download')} នាំចេញ Excel</button>
     <button class="btn" id="btnExportHJson" title="ទម្រង់ header ៦២ ជួរ (JSON)">${icon('download')} នាំចេញ JSON</button>
     <button class="btn primary" data-nav="form">${icon('plus')} បន្ថែមសិស្សថ្មី</button>`);

  $('#view').innerHTML = `
  <div class="card">
    <div class="toolbar">
      <div class="search-box">${icon('search')}<input type="search" id="q" placeholder="ស្វែងរកឈ្មោះ លេខសម្គាល់ ឬលេខទូរស័ព្ទ..." value="${esc(state.filters.q)}"></div>
      <div class="filter-group">
        <select id="fGrade"><option value="">ថ្នាក់ទាំងអស់</option>${GRADES.map(g => `<option ${state.filters.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select>

          <option value="ethnic" ${state.filters.flag === 'ethnic' ? 'selected' : ''}>ជនជាតិភាគតិច</option>
          <option value="reading" ${state.filters.flag === 'reading' ? 'selected' : ''}>កញ្ចប់អំណាន</option>

      <b id="bulkCount">0</b><span>នាក់ត្រូវបានជ្រើសរើស</span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn sm" id="bulkExport">${icon('download')} នាំចេញ</button>
        <button class="btn sm danger" id="bulkDelete">${icon('trash')} លុប</button>
        <button class="btn sm ghost" id="bulkClear">${icon('x')}</button>

      <table>
        <thead><tr>
          <th style="width:36px"><input type="checkbox" id="checkAll"></th>

          <th>ភេទ</th>
          <th>ថ្ងៃកំណើត</th>
          <th>ថ្នាក់</th>
          <th>ទំនាក់ទំនង</th>
          <th>ស្ថានភាព</th>
          <th style="width:118px;text-align:right">សកម្មភាព</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pager" id="pager"></div>

  renderRows();

  const q = $('#q');
  let t;
  q.addEventListener('input', e => {
    state.filters.q = e.target.value; state.filters.page = 1;
    clearTimeout(t); t = setTimeout(renderRows, 160);
  });
  $('#fGrade').addEventListener('change', e => { state.filters.grade = e.target.value; state.filters.page = 1; renderRows(); });
  $('#fGender').addEventListener('change', e => { state.filters.gender = e.target.value; state.filters.page = 1; renderRows(); });
  $('#fFlag').addEventListener('change', e => { state.filters.flag = e.target.value; state.filters.page = 1; renderRows(); });
  $('#btnClear').addEventListener('click', () => {
    state.filters = { q: '', grade: '', gender: '', flag: '', page: 1, size: state.filters.size, layout: state.filters.layout };
    renderList();
  });
  $('#btnExportList').addEventListener('click', () => exportExcel(filtered(), 'students'));
  $('#btnExportHJson').addEventListener('click', () => exportHeaderJSON(filtered(), 'students-header'));
  $$('#listLayout [data-layout]').forEach(b => b.addEventListener('click', () => {
    state.filters.layout = b.dataset.layout;
    try { localStorage.setItem('sis_ll', b.dataset.layout); } catch (e) {}
    $$('#listLayout [data-layout]').forEach(x => x.classList.toggle('on', x === b));
    state.filters.page = 1;
    renderRows();
  }));
  $('#bulkClear').addEventListener('click', () => { state.selected.clear(); renderRows(); });
  $('#bulkDelete').addEventListener('click', bulkDelete);
  $('#bulkExport').addEventListener('click', () => {
    const list = state.students.filter(s => state.selected.has(s.id));
    exportExcel(list, 'selected-students');
  });
  $('#checkAll').addEventListener('change', e => {
    const list = pageItems();
    if (e.target.checked) list.forEach(s => state.selected.add(s.id));
    else list.forEach(s => state.selected.delete(s.id));
    renderRows();
  });
}

      <div class="track"><i class="${tone}" style="width:${pct}%"></i></div><b>${pct}%</b>
    </div>

      <button class="btn sm" data-act="view" data-id="${esc(s.id)}">${icon('eye')} មើល</button>
      <button class="btn sm" data-act="edit" data-id="${esc(s.id)}">${icon('edit')} កែ</button>

}

function renderCardRows() {
  const all = filtered();
  const size = state.filters.size;
  const pages = Math.max(1, Math.ceil(all.length / size));
  if (state.filters.page > pages) state.filters.page = pages;
  const items = pageItems();
  const box = $('#listCards'), tw = $('#listTable');
  if (!box) return;
  if (tw) tw.style.display = 'none';
  box.style.display = 'block';

  if (!all.length) {
    box.innerHTML = `<div class="empty" style="padding:36px 16px"><div class="art">${icon('users')}</div><h4>${state.students.length ? 'រកមិនឃើញសិស្ស' : 'មិនទាន់មានទិន្នន័យសិស្ស'}</h4><p>${state.students.length ? 'សូមព្យាយាមស្វែងរកដោយពាក្យផ្សេង ឬសម្អាតតម្រង' : 'ចាប់ផ្ដើមដោយការចុះឈ្មោះសិស្សថ្មី'}</p><button class="btn primary" data-nav="form">${icon('plus')} ចុះឈ្មោះសិស្ស</button></div>`;
    const p = $('#pager'); if (p) p.innerHTML = '';
    updateBulk();
    return;
  }

  box.innerHTML = `<div class="scards-bar"><span>សិស្ស <b>${all.length}</b> នាក់ · ទំព័រ ${state.filters.page}/${pages}</span><button class="btn sm ghost" id="cardSelAll" style="margin-left:auto">${icon('check')} ជ្រើសទាំងអស់</button></div>
    <div class="scards">${items.map(studentCardHTML).join('')}</div>`;

  const from = (state.filters.page - 1) * size + 1;
  const to = Math.min(all.length, state.filters.page * size);
  const pageBtns = [];
  const start = Math.max(1, Math.min(state.filters.page - 2, pages - 4));
  for (let p = start; p <= Math.min(pages, start + 4); p++) pageBtns.push(`<button data-page="${p}" class="${p === state.filters.page ? 'on' : ''}">${p}</button>`);
  const pager = $('#pager');
  if (pager) pager.innerHTML = `
    <span>បង្ហាញ <b>${from}–${to}</b> ក្នុងចំណោម <b>${all.length}</b> នាក់</span>
    <select id="pageSize" style="width:auto;min-height:32px;padding:2px 28px 2px 10px;font-size:12px">
      ${[10, 25, 50, 100].map(n => `<option value="${n}" ${state.filters.size === n ? 'selected' : ''}>${n} / ទំព័រ</option>`).join('')}
    </select>
    <div class="pages">
      <button data-page="${Math.max(1, state.filters.page - 1)}" ${state.filters.page === 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      ${pageBtns.join('')}
      <button data-page="${Math.min(pages, state.filters.page + 1)}" ${state.filters.page === pages ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>`;

  $$('#pager [data-page]').forEach(b => b.addEventListener('click', () => {
    state.filters.page = +b.dataset.page; renderCardRows();
  }));
  const ps = $('#pageSize');
  if (ps) ps.addEventListener('change', e => { state.filters.size = +e.target.value; state.filters.page = 1; renderCardRows(); });
  $$('#listCards .rowCheck').forEach(c => c.addEventListener('change', e => {
    if (e.target.checked) state.selected.add(e.target.dataset.id); else state.selected.delete(e.target.dataset.id);
    updateBulk();
  }));
  $$('#listCards .scard').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button') || e.target.closest('label') || e.target.closest('input')) return;
    openStudent(el.dataset.id);
  }));
  const sa = $('#cardSelAll');
  if (sa) sa.addEventListener('click', () => {
    const list = pageItems();
    const on = list.every(s => state.selected.has(s.id));
    list.forEach(s => on ? state.selected.delete(s.id) : state.selected.add(s.id));
    renderCardRows();
  });
  updateBulk();
}
function pageItems() {
  const list = filtered();
  const size = state.filters.size, p = state.filters.page;
  return list.slice((p - 1) * size, p * size);
}
function statusBadges(s) {
  const b = [];
  if (isYes(s.poorFamily)) b.push('<span class="pill amber">ក្រីក្រ</span>');
  if (isYes(s.equityCard)) b.push('<span class="pill blue">សមធម៌</span>');
  if (s.disabilityType && s.disabilityType !== 'គ្មាន') b.push(`<span class="pill red">${esc(s.disabilityType)}</span>`);
  if (s.ethnic && s.ethnic !== 'ខ្មែរ') b.push(`<span class="pill green">${esc(s.ethnic)}</span>`);
  return b.length ? b.slice(0, 2).join(' ') : '<span class="cell-sub">—</span>';
}
function phoneOf(s) { return s.gPhone || s.mPhone || s.fPhone || s.phone || ''; }

function renderRows() {
  if (state.filters.layout === 'cards') { renderCardRows(); return; }
  const lt = $('#listTable'), lc = $('#listCards');
  if (lt) lt.style.display = '';
  if (lc) lc.style.display = 'none';
  const all = filtered();
  const size = state.filters.size;
  const pages = Math.max(1, Math.ceil(all.length / size));
  if (state.filters.page > pages) state.filters.page = pages;
  const items = pageItems();
  const tb = $('#rows'); if (!tb) return;

  if (!all.length) {
    tb.innerHTML = `<tr><td colspan="9"><div class="empty"><div class="art">${icon('users')}</div><h4>${state.students.length ? 'រកមិនឃើញសិស្ស' : 'មិនទាន់មានទិន្នន័យសិស្ស'}</h4><p>${state.students.length ? 'សូមព្យាយាមស្វែងរកដោយពាក្យផ្សេង ឬសម្អាតតម្រង' : 'ចាប់ផ្ដើមដោយការចុះឈ្មោះសិស្សថ្មី'}</p><button class="btn primary" data-nav="form">${icon('plus')} ចុះឈ្មោះសិស្ស</button></div></td></tr>`;
  } else {
    tb.innerHTML = items.map((s, i) => {
      const idx = (state.filters.page - 1) * size + i + 1;
      return `<tr>
        <td><input type="checkbox" class="rowCheck" data-id="${esc(s.id)}" ${state.selected.has(s.id) ? 'checked' : ''}></td>
        <td class="cell-sub">${idx}</td>
        <td class="name-cell"><div class="t-name"><div class="avatar ${s.gender === 'ស្រី' ? 'f' : ''}">${esc(initials(s))}</div><div><b data-act="view" data-id="${esc(s.id)}" style="cursor:pointer" title="${esc(fullName(s))}">${esc(fullName(s))}</b><span>${esc(s.id)}</span></div></div></td>
        <td>${esc(s.gender || '—')}</td>
        <td class="cell-sub">${fmtDate(s.dob)}</td>
        <td>${esc(s.grade || '—')}</td>
        <td class="cell-sub">${esc(phoneOf(s) || '—')}</td>
        <td>${statusBadges(s)}</td>
        <td><div class="row-actions">
          <button class="btn" data-act="view" data-id="${esc(s.id)}" title="មើលប្រវត្តិរូប">${icon('eye')}</button>
          <button class="btn" data-act="edit" data-id="${esc(s.id)}" title="កែប្រែ">${icon('edit')}</button>
          <button class="btn del" data-act="del" data-id="${esc(s.id)}" title="លុប">${icon('trash')}</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  const from = all.length ? (state.filters.page - 1) * size + 1 : 0;
  const to = Math.min(all.length, state.filters.page * size);
  const pageBtns = [];
  const start = Math.max(1, Math.min(state.filters.page - 2, pages - 4));
  for (let p = start; p <= Math.min(pages, start + 4); p++) pageBtns.push(`<button data-page="${p}" class="${p === state.filters.page ? 'on' : ''}">${p}</button>`);

  const pager = $('#pager');
  if (pager) pager.innerHTML = `
    <span>បង្ហាញ <b>${from}–${to}</b> ក្នុងចំណោម <b>${all.length}</b> នាក់</span>
    <select id="pageSize" style="width:auto;min-height:32px;padding:2px 28px 2px 10px;font-size:12px">
      ${[10, 25, 50, 100].map(n => `<option value="${n}" ${state.filters.size === n ? 'selected' : ''}>${n} / ទំព័រ</option>`).join('')}
    </select>
    <div class="pages">
      <button data-page="${Math.max(1, state.filters.page - 1)}" ${state.filters.page === 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      ${pageBtns.join('')}
      <button data-page="${Math.min(pages, state.filters.page + 1)}" ${state.filters.page === pages ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>`;

  $$('#pager [data-page]').forEach(b => b.addEventListener('click', () => {
    state.filters.page = +b.dataset.page; renderRows();
  }));
  const ps = $('#pageSize');
  if (ps) ps.addEventListener('change', e => { state.filters.size = +e.target.value; state.filters.page = 1; renderRows(); });

  $$('.rowCheck').forEach(c => c.addEventListener('change', e => {
    if (e.target.checked) state.selected.add(e.target.dataset.id); else state.selected.delete(e.target.dataset.id);
    updateBulk();
  }));
  const ca = $('#checkAll');
  if (ca) ca.checked = items.length > 0 && items.every(s => state.selected.has(s.id));
  updateBulk();
}
function updateBulk() {
  const bar = $('#bulkBar');
  if (!bar) return;
  const n = state.selected.size;
  bar.style.display = n ? 'flex' : 'none';
  const c = $('#bulkCount'); if (c) c.textContent = n;
}
function bulkDelete() {
  const n = state.selected.size;
  if (!n) return;
  confirmBox({ title: 'លុបទិន្នន័យសិស្ស', msg: `តើអ្នកពិតជាចង់លុបទិន្នន័យរបស់សិស្ស <b>${n}</b> នាក់ នេះមែនទេ? សកម្មភាពនេះមិនអាចត្រឡប់វិញបានឡើយ។`, ok: 'លុប' }).then(ok => {
    if (!ok) return;
    state.students = state.students.filter(s => !state.selected.has(s.id));
    state.selected.clear(); persist(); updateSideBadge(); renderList();
    toast('បានលុបទិន្នន័យដោយជោគជ័យ');
  });
}

function openStudent(id) {
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-head">
      <div><h3>ប្រវត្តិរូបសិស្ស</h3><p>${esc(fullName(s))} • ${esc(s.id)}</p></div>
      <button class="btn icon" data-close>${icon('x')}</button>
    </div>
    <div class="modal-body">${sheetHTML(s)}</div>
    <div class="modal-foot">
      <button class="btn" data-print>${icon('printer')} បោះពុម្ព</button>
      <div class="right">
        <button class="btn" data-close>បិទ</button>
        <button class="btn primary" data-edit>${icon('edit')} កែប្រែ</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  $('[data-edit]', ov).addEventListener('click', () => { close(); location.hash = '#/form/' + encodeURIComponent(s.id); });
  $('[data-print]', ov).addEventListener('click', () => printHTML(sheetHTML(s)));
}

/* ---------------- confirm ---------------- */
function confirmBox({ title, msg, ok = 'យល់ព្រម', cancel = 'បោះបង់', danger = true }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal confirm">
      <div class="modal-body">
        <div class="warn-ico">${icon(danger ? 'alert' : 'info')}</div>
        <h4>${esc(title)}</h4>
        <p>${msg}</p>
      </div>
      <div class="modal-foot" style="justify-content:flex-end">
        <button class="btn" data-no>${esc(cancel)}</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const end = v => { ov.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') end(false); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('click', e => { if (e.target === ov) end(false); });
    $('[data-no]', ov).addEventListener('click', () => end(false));
    $('[data-yes]', ov).addEventListener('click', () => end(true));
    setTimeout(() => $('[data-yes]', ov).focus(), 30);
  });
}

/* ---------------- reports ---------------- */
function reportData() {
  const S = state.students;
  const rows = GRADES.map(g => {
    const list = S.filter(s => s.grade === g);
    if (!list.length) return null;
    return {
      g, total: list.length,
      f: list.filter(s => s.gender === 'ស្រី').length,
      poor: list.filter(s => isYes(s.poorFamily)).length,
      dis: list.filter(s => s.disabilityType && s.disabilityType !== 'គ្មាន').length,
      eth: list.filter(s => s.ethnic && s.ethnic !== 'ខ្មែរ').length,
      eq: list.filter(s => isYes(s.equityCard)).length,
      read: list.filter(s => s.readingPack === 'បានទទួល').length,
      math: list.filter(s => s.mathPack === 'បានទទួល').length
    };
  }).filter(Boolean);
  return rows;
}

/* ---------------- appearance ---------------- */
function wireAppearance() {
  const seg = $('#modeSeg');
  if (seg) $$('button[data-mode]', seg).forEach(b => b.addEventListener('click', () => {
    setTheme(b.dataset.mode === 'dark');
    $$('button[data-mode]', seg).forEach(x => x.classList.toggle('on', x === b));
  }));
  const opts = $('#bgOpts');
  if (opts) $$('[data-bg-set]', opts).forEach(b => b.addEventListener('click', () => {
    setBg({ id: b.dataset.bgSet });
    const nm = BG_PRESETS.find(x => x.id === b.dataset.bgSet);
    toast(nm && nm.id !== 'default' ? 'ពណ៌ផ្ទៃ៖ ' + nm.name : 'ត្រឡប់ទៅពណ៌ស្តង់ដារ', 'ok', 1400);
  }));
  const ci = $('#bgCustom');
  if (ci) {
    ci.addEventListener('input', () => setBg({ id: 'custom', hex: ci.value }));
    ci.addEventListener('change', () => setBg({ id: 'custom', hex: ci.value }));
  }
  const rs = $('#bgReset');
  if (rs) rs.addEventListener('click', () => { setBg({ id: 'default' }); if (ci) ci.value = '#5aa9c9'; toast('បានកំណត់ពណ៌ឡើងវិញ', 'ok', 1400); });
  syncBgUI(bgState());
}

/* ---------------- export / import ---------------- */
function exportExcel(list, name) {
  if (!list.length) { toast('មិនមានទិន្នន័យសម្រាប់នាំចេញ', 'warn'); return; }
  const cols = [
    ['លេខសម្គាល់', s => s.id], ['គោត្តនាម', s => s.surname], ['នាម', s => s.name], ['ភេទ', s => s.gender],
    ['ថ្ងៃខែឆ្នាំកំណើត', s => fmtDate(s.dob)], ['ទូរស័ព្ទ', s => s.phone], ['សញ្ជាតិ', s => s.nationality],
    ['ទីកន្លែងកំណើត', s => addrText(s, 'bp')], ['អាសយដ្ឋានបច្ចុប្បន្ន', s => addrText(s, 'cu')],
    ['ឆ្នាំសិក្សា', s => s.schoolYear], ['ថ្នាក់', s => s.grade], ['ថ្នាក់ឆ្នាំមុន', s => s.prevGrade],

/* ---------------- router ---------------- */
function route() {
  const raw = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  const seg = raw.split('/');
  const view = seg[0] || 'dashboard';
  state.view = ['dashboard', 'form', 'list', 'reports', 'population', 'cards', 'settings'].includes(view) ? view : 'dashboard';
  state.editingId = null;

  if (state.view === 'dashboard') { renderDashboardView(); }
  else if (state.view === 'form') {
    const id = seg[1] ? decodeURIComponent(seg[1]) : null;
    const rec = id ? state.students.find(s => s.id === id) : null;
    renderForm(rec || null);
  }
  else if (state.view === 'list') renderList();
  else if (state.view === 'reports') renderReports();
  else if (state.view === 'population') renderPopulation();
  else if (state.view === 'cards') renderCards();
  else if (state.view === 'settings') renderSettings();

  updateNav();
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function renderDashboardView() {
  setTop('ផ្ទាំងគ្រប់គ្រង', `ទិដ្ឋភាពរួម — ឆ្នាំសិក្សា ${state.settings.year}`,
    `<button class="btn" data-nav="reports">${icon('chart')} របាយការណ៍</button>
     <button class="btn primary" data-nav="form">${icon('plus')} ចុះឈ្មោះសិស្ស</button>`);
  $('#view').innerHTML = renderDashboard();
}

function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

/* ---------------- global events ---------------- */
function init() {
  loadDB();
  updateSideBadge();

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { location.hash = '#/' + nav.dataset.nav; return; }
    const navItem = e.target.closest('.nav-item');
    if (navItem) { location.hash = '#/' + navItem.dataset.view; return; }

    const act = e.target.closest('[data-act]');
    if (act) {
      const id = act.dataset.id;
      if (act.dataset.act === 'view') openStudent(id);
      else if (act.dataset.act === 'edit') location.hash = '#/form/' + encodeURIComponent(id);
      else if (act.dataset.act === 'del') {
        const s = state.students.find(x => x.id === id);
        if (!s) return;
        confirmBox({ title: 'លុបទិន្នន័យសិស្ស', msg: `តើអ្នកពិតជាចង់លុបព័ត៌មានរបស់ <b>${esc(fullName(s))}</b> (${esc(s.id)}) មែនទេ?`, ok: 'លុប' }).then(ok => {
          if (!ok) return;
          state.students = state.students.filter(x => x.id !== id);
          state.selected.delete(id);
          persist(); updateSideBadge(); renderRows();
          toast('បានលុបទិន្នន័យ');
        });
      }
      return;
    }
  });

  setTheme(isDark());
  const thBtn = $('#themeBtn');
  if (thBtn) thBtn.addEventListener('click', () => setTheme(!isDark()));
  renderSideBg();
  const bpd = $('#bpDots');
  if (bpd) bpd.addEventListener('click', e => {
    const b = e.target.closest('[data-bg-set]');
    if (!b) return;
    setBg({ id: b.dataset.bgSet });
  });

  $('#menuBtn').addEventListener('click', openSidebar);
  $('#scrim').addEventListener('click', closeSidebar);

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      const form = $('#studentForm');
      if (form) { e.preventDefault(); form.requestSubmit(); }
    }
  });

  window.addEventListener('hashchange', route);
  if (!location.hash) location.hash = '#/dashboard'; else route();
}

document.addEventListener('DOMContentLoaded', init);
